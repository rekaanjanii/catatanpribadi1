<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CATATAN DATA - ADMIN DASHBOARD</title>
    <style>
        :root {
            --accent-color: #7239ea;
            --accent-glow: rgba(114, 57, 234, 0.4);
            --text-color: #ffffff;
            --text-muted: #c2c2d6;
            --success: #50cd89;
            --danger: #f1416c;
            
            --glass-bg: rgba(22, 22, 37, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: 16px;
            --wallpaper-brightness: 70%;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: #090a10;
            color: var(--text-color); 
            height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* Background Layer Wallpaper */
        #bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            filter: brightness(var(--wallpaper-brightness));
            transition: background-image 0.5s ease, filter 0.3s ease;
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.9); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
            padding: 20px;
        }
        .login-box {
            background: rgba(25, 25, 45, 0.85); backdrop-filter: blur(20px);
            border: 1px solid var(--accent-glow); padding: 35px 25px; border-radius: 20px; 
            width: 100%; max-width: 350px; text-align: center;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulseGlow 4s infinite alternate;
        }
        .login-box h2 { margin-bottom: 20px; color: #fff; font-size: 1.5rem; letter-spacing: 1px; }
        .login-box input {
            width: 100%; padding: 12px 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.6); color: #fff; outline: none; font-size: 0.95rem;
        }
        .login-box button {
            width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #7239ea, #9d62ff); color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem;
            box-shadow: 0 4px 15px var(--accent-glow); transition: 0.3s;
        }

        /* Header Navigation Top */
        .top-navbar {
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand-title { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px var(--accent-color); }
        
        .sync-badge {
            font-size: 0.75rem; padding: 5px 12px; border-radius: 20px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            font-weight: bold;
        }
        .sync-badge.saving { color: #ffc107; border-color: #ffc107; }
        .sync-badge.saved { color: var(--success); border-color: var(--success); }
        .sync-badge.error { color: var(--danger); border-color: var(--danger); }

        /* Main View Container */
        .content-body {
            flex: 1; padding: 20px; overflow-y: auto; position: relative;
        }

        /* DASHBOARD HOMEPAGE GRID (MEWAH & MOVING EFFECT) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: floatCard 4s ease-in-out infinite;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px;
        }

        /* Delay animasi agar gerakan kartu selaras namun dinamis */
        .menu-card:nth-child(1) { animation-delay: 0s; }
        .menu-card:nth-child(2) { animation-delay: 0.4s; }
        .menu-card:nth-child(3) { animation-delay: 0.8s; }
        .menu-card:nth-child(4) { animation-delay: 1.2s; }
        .menu-card:nth-child(5) { animation-delay: 1.6s; }
        .menu-card:nth-child(6) { animation-delay: 2.0s; }

        .menu-card:hover, .menu-card:active {
            transform: translateY(-8px) scale(1.03);
            border-color: var(--accent-color);
            box-shadow: 0 12px 30px var(--accent-glow);
            background: rgba(35, 35, 60, 0.8);
        }

        .card-icon {
            width: 55px; height: 55px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(114,57,234,0.2), rgba(157,98,255,0.4));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 0.95rem; font-weight: 600; color: #fff; letter-spacing: 0.5px;
        }

        /* PAGE VIEWS (HALAMAN TERPISAH) */
        .page-view { display: none; max-width: 800px; margin: 0 auto; width: 100%; }
        .page-view.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        .page-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .btn-back {
            background: rgba(255,255,255,0.15); border: 1px solid var(--glass-border); color: #fff;
            padding: 8px 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; gap: 5px; backdrop-filter: blur(5px);
        }

        /* FORM INPUTS */
        .form-box {
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); padding: 15px; border-radius: 14px; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .form-box input {
            padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.5); color: #fff; outline: none; font-size: 0.9rem;
        }
        .btn-action {
            padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #7239ea, #9d62ff); color: #fff; font-size: 0.9rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* KARTU VERTIKAL UNTUK TABEL MOBILE (AUTO SCROLL DOWN) */
        .data-list-vertical {
            display: flex; flex-direction: column; gap: 12px;
        }
        .data-card-item {
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px 16px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .data-info { display: flex; flex-direction: column; gap: 4px; }
        .data-primary { font-weight: bold; font-size: 1rem; color: #fff; }
        .data-secondary { font-size: 0.8rem; color: var(--text-muted); }
        .data-amount { font-weight: bold; color: var(--success); font-size: 0.95rem; }

        .btn-delete {
            background: var(--danger); border: none; color: #fff; padding: 6px 12px;
            border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
        }

        .status-pill {
            padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
        }
        .status-pending { background: #ffc107; color: #000; }
        .status-done { background: var(--success); color: #fff; }

        .total-banner {
            margin-top: 20px; padding: 15px; background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); border-radius: 12px; text-align: right;
            font-size: 1.1rem; font-weight: bold;
        }

        /* PANEL SETTING ADMIN */
        .settings-card {
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); padding: 20px; border-radius: 14px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .setting-item { display: flex; flex-direction: column; gap: 6px; }
        .setting-item label { font-size: 0.85rem; color: var(--text-muted); }
        .setting-item input, .setting-item select {
            padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.5); color: #fff; outline: none;
        }

        /* ANIMASI BERSINAR & MELAYANG */
        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(114,57,234,0.3); }
            100% { box-shadow: 0 0 35px rgba(114,57,234,0.7); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Layer Wallpaper -->
    <div id="bg-layer"></div>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>LOGIN ADMIN</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">MASUK DASHBOARD</button>
            <p id="login-error" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- Layout Utama -->
    <div class="app-container">
        <!-- Top Navbar -->
        <div class="top-navbar">
            <div class="brand-title">CATATAN DATA</div>
            <div id="sync-indicator" class="sync-badge">🟢 Terhubung</div>
        </div>

        <!-- Content Body -->
        <div class="content-body">

            <!-- HALAMAN 0: DASHBOARD UTAMA (MENU MEWAH GRID) -->
            <div id="page-dashboard" class="page-view active">
                <div style="text-align: center; margin-bottom: 25px;">
                    <h2 style="font-size: 1.4rem; font-weight: 700;">Selamat Datang, Admin</h2>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Pilih menu di bawah untuk mengelola data</p>
                </div>

                <div class="dashboard-grid">
                    <div class="menu-card" onclick="navigateTo('pemasukkan')">
                        <div class="card-icon">💰</div>
                        <div class="card-title">Tabel Pemasukkan</div>
                    </div>
                    <div class="menu-card" onclick="navigateTo('pengeluaran')">
                        <div class="card-icon">💸</div>
                        <div class="card-title">Tabel Pengeluaran</div>
                    </div>
                    <div class="menu-card" onclick="navigateTo('jadwal')">
                        <div class="card-icon">📅</div>
                        <div class="card-title">Jadwal Job</div>
                    </div>
                    <div class="menu-card" onclick="navigateTo('utang')">
                        <div class="card-icon">🤝</div>
                        <div class="card-title">Utang / Piutang</div>
                    </div>
                    <div class="menu-card" onclick="navigateTo('simpanan')">
                        <div class="card-icon">🏦</div>
                        <div class="card-title">Data Simpanan</div>
                    </div>
                    <div class="menu-card" onclick="navigateTo('settings')">
                        <div class="card-icon">⚙️</div>
                        <div class="card-title">Pengaturan Admin</div>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 10px;">
                    <button onclick="logout()" style="background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;">Logout Admin</button>
                </div>
            </div>

            <!-- HALAMAN DINAMIS TABEL (PEMASUKKAN, PENGELUARAN, SIMPANAN, UTANG, JADWAL) -->
            <div id="page-data" class="page-view">
                <div class="page-header">
                    <button class="btn-back" onclick="navigateTo('dashboard')">⬅ Kembali</button>
                    <h3 id="current-page-title" style="font-size: 1.1rem;">Tabel Data</h3>
                </div>

                <!-- Form Input -->
                <div class="form-box" id="dynamic-form">
                    <!-- Form Diisi JS -->
                </div>

                <!-- Daftar Data Mode Vertikal (Scroll Ke Bawah) -->
                <div class="data-list-vertical" id="data-list-container">
                    <!-- List Diisi JS -->
                </div>

                <!-- Total Banner -->
                <div class="total-banner" id="total-banner-box">
                    Total: <span id="total-amount-val" style="color: var(--success);">Rp 0</span>
                </div>
            </div>

            <!-- HALAMAN PENGATURAN ADMIN & WALLPAPER -->
            <div id="page-settings" class="page-view">
                <div class="page-header">
                    <button class="btn-back" onclick="navigateTo('dashboard')">⬅ Kembali</button>
                    <h3 style="font-size: 1.1rem;">Pengaturan Admin</h3>
                </div>

                <div class="settings-card">
                    <div class="setting-item">
                        <label>Unggah Wallpaper Halaman Depan (Galeri HP/iPhone):</label>
                        <input type="file" id="wallpaper-file-input" accept="image/*" onchange="handleWallpaperUpload(event)">
                    </div>
                    <div class="setting-item">
                        <label>Atau Menggunakan Link Gambar Web:</label>
                        <input type="text" id="wallpaper-url-input" placeholder="https://..." onchange="setWallpaperURL(this.value)">
                    </div>
                    <div class="setting-item">
                        <label>Kecerahan Wallpaper (Brightness):</label>
                        <input type="range" id="val-brightness" min="20" max="100" value="70" onchange="saveSettings()" oninput="previewBrightness(this.value)">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        const JSONBIN_BIN_ID = "6a97e858f5f4af5e296025b0"; 
        const JSONBIN_API_KEY = "$2a$10$RToIDZQyfCwAmmFIgopn6O1Nf2lOWMZy5cE7zwXLMHjagMg0EP5I."; 

        let appData = {
            settings: { wallpaper: "", brightness: 70 },
            pemasukkan: [],
            pengeluaran: [],
            jadwal: [],
            utang: [],
            simpanan: []
        };

        let activeCategory = 'pemasukkan';
        let autoSaveTimer = null;

        // Cek Login Saat Muat Halaman
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('is_admin_logged_in');
            if (isLoggedIn === 'true') {
                document.getElementById('login-overlay').classList.add('hidden');
                loadDataFromLocal();
            }
        });

        function setSyncStatus(text, statusClass) {
            const el = document.getElementById('sync-indicator');
            el.innerText = text;
            el.className = `sync-badge ${statusClass}`;
        }

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem('is_admin_logged_in', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('login-error').innerText = "";
                loadDataFromLocal();
            } else {
                document.getElementById('login-error').innerText = "Username atau Password Salah!";
            }
        }

        function logout() {
            localStorage.removeItem('is_admin_logged_in');
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }

        // Navigasi Per Halaman
        function navigateTo(targetPage) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));

            if (targetPage === 'dashboard') {
                document.getElementById('page-dashboard').classList.add('active');
            } else if (targetPage === 'settings') {
                document.getElementById('page-settings').classList.add('active');
                loadSettingsUI();
            } else {
                activeCategory = targetPage;
                document.getElementById('page-data').classList.add('active');
                renderCategoryView();
            }
        }

        // Kompresi Wallpaper agar Kompatibel dengan HP (iOS / Android Gallery Upload)
        function handleWallpaperUpload(event) {
            const file = event.target.files[0];
            if (file) {
                setSyncStatus("⏳ Memproses Foto...", "saving");
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Batasi resolusi maksimal agar ringan tersimpan di cloud JSONBin
                        const maxDim = 1080;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDim) {
                                height *= maxDim / width;
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width *= maxDim / height;
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        // Simpan sebagai Base64 terkompres
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        appData.settings.wallpaper = compressedBase64;
                        applyWallpaperStyle();
                        saveAndAutoSync();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function setWallpaperURL(url) {
            appData.settings.wallpaper = url;
            applyWallpaperStyle();
            saveAndAutoSync();
        }

        function previewBrightness(val) {
            document.documentElement.style.setProperty('--wallpaper-brightness', `${val}%`);
        }

        function saveSettings() {
            appData.settings.brightness = document.getElementById('val-brightness').value;
            applyWallpaperStyle();
            saveAndAutoSync();
        }

        function loadSettingsUI() {
            document.getElementById('val-brightness').value = appData.settings.brightness || 70;
            document.getElementById('wallpaper-url-input').value = appData.settings.wallpaper && !appData.settings.wallpaper.startsWith('data:image') ? appData.settings.wallpaper : "";
        }

        function applyWallpaperStyle() {
            const bgLayer = document.getElementById('bg-layer');
            const cfg = appData.settings || { wallpaper: "", brightness: 70 };

            if (cfg.wallpaper) {
                bgLayer.style.backgroundImage = `url('${cfg.wallpaper}')`;
            } else {
                bgLayer.style.backgroundImage = 'none';
            }

            document.documentElement.style.setProperty('--wallpaper-brightness', `${cfg.brightness || 70}%`);
        }

        // Render Halaman Data
        function renderCategoryView() {
            const titleEl = document.getElementById('current-page-title');
            const formEl = document.getElementById('dynamic-form');
            const listEl = document.getElementById('data-list-container');
            const totalBannerBox = document.getElementById('total-banner-box');

            const pageTitles = {
                pemasukkan: 'Tabel Pemasukkan',
                pengeluaran: 'Tabel Pengeluaran',
                jadwal: 'Jadwal Job',
                utang: 'Utang / Piutang',
                simpanan: 'Data Simpanan'
            };

            titleEl.innerText = pageTitles[activeCategory];
            formEl.innerHTML = '';
            listEl.innerHTML = '';

            // Form Input Dinamis
            if (activeCategory === 'pemasukkan' || activeCategory === 'pengeluaran' || activeCategory === 'simpanan') {
                totalBannerBox.classList.remove('hidden');
                formEl.innerHTML = `
                    <input type="date" id="inp-date">
                    <input type="text" id="inp-name" placeholder="Nama / Keterangan">
                    <input type="number" id="inp-amount" placeholder="Nominal / Jumlah (Rp)">
                    <button class="btn-action" onclick="addData()">+ Tambah Data</button>
                `;
            } else if (activeCategory === 'utang') {
                totalBannerBox.classList.remove('hidden');
                formEl.innerHTML = `
                    <input type="text" id="inp-name" placeholder="Nama">
                    <input type="number" id="inp-amount" placeholder="Nominal / Total (Rp)">
                    <button class="btn-action" onclick="addData()">+ Tambah Data</button>
                `;
            } else if (activeCategory === 'jadwal') {
                totalBannerBox.classList.add('hidden');
                formEl.innerHTML = `
                    <input type="text" id="inp-name" placeholder="Nama Tempat/Outlet/Resto">
                    <input type="text" id="inp-loc" placeholder="Lokasi">
                    <input type="date" id="inp-date">
                    <button class="btn-action" onclick="addData()">+ Tambah Job</button>
                `;
            }

            // Render List Vertikal (Tampilan Kartu HP)
            let total = 0;
            if (appData[activeCategory] && appData[activeCategory].length > 0) {
                appData[activeCategory].forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'data-card-item';

                    if (activeCategory === 'pemasukkan' || activeCategory === 'pengeluaran' || activeCategory === 'simpanan') {
                        total += Number(item.amount);
                        card.innerHTML = `
                            <div class="data-info">
                                <div class="data-primary">${item.name}</div>
                                <div class="data-secondary">📅 ${item.date}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:12px;">
                                <div class="data-amount">Rp ${Number(item.amount).toLocaleString('id-ID')}</div>
                                <button class="btn-delete" onclick="deleteData(${index})">Hapus</button>
                            </div>
                        `;
                    } else if (activeCategory === 'utang') {
                        total += Number(item.amount);
                        card.innerHTML = `
                            <div class="data-info">
                                <div class="data-primary">${item.name}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:12px;">
                                <div class="data-amount">Rp ${Number(item.amount).toLocaleString('id-ID')}</div>
                                <button class="btn-delete" onclick="deleteData(${index})">Hapus</button>
                            </div>
                        `;
                    } else if (activeCategory === 'jadwal') {
                        const statusClass = item.status === 'Selesai' ? 'status-done' : 'status-pending';
                        const statusText = item.status === 'Selesai' ? '✔ Selesai' : '⏳ Pending';
                        card.innerHTML = `
                            <div class="data-info">
                                <div class="data-primary">${item.name}</div>
                                <div class="data-secondary">📍 ${item.loc} | 📅 ${item.date}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="status-pill ${statusClass}" onclick="toggleStatus(${index})">${statusText}</span>
                                <button class="btn-delete" onclick="deleteData(${index})">Hapus</button>
                            </div>
                        `;
                    }
                    listEl.appendChild(card);
                });
            } else {
                listEl.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.9rem;">Belum ada data tersimpan</div>`;
            }

            document.getElementById('total-amount-val').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function addData() {
            let item = {};
            if (activeCategory === 'pemasukkan' || activeCategory === 'pengeluaran' || activeCategory === 'simpanan') {
                const date = document.getElementById('inp-date').value;
                const name = document.getElementById('inp-name').value;
                const amount = document.getElementById('inp-amount').value;
                if (!date || !name || !amount) return alert("Isi semua bidang!");
                item = { date, name, amount: Number(amount) };
            } else if (activeCategory === 'utang') {
                const name = document.getElementById('inp-name').value;
                const amount = document.getElementById('inp-amount').value;
                if (!name || !amount) return alert("Isi semua bidang!");
                item = { name, amount: Number(amount) };
            } else if (activeCategory === 'jadwal') {
                const name = document.getElementById('inp-name').value;
                const loc = document.getElementById('inp-loc').value;
                const date = document.getElementById('inp-date').value;
                if (!name || !loc || !date) return alert("Isi semua bidang!");
                item = { name, loc, date, status: 'Pending' };
            }

            appData[activeCategory].push(item);
            saveAndAutoSync();
            renderCategoryView();
        }

        function deleteData(index) {
            appData[activeCategory].splice(index, 1);
            saveAndAutoSync();
            renderCategoryView();
        }

        function toggleStatus(index) {
            appData.jadwal[index].status = appData.jadwal[index].status === 'Selesai' ? 'Pending' : 'Selesai';
            saveAndAutoSync();
            renderCategoryView();
        }

        // Auto Save ke Storage & Cloud
        function saveAndAutoSync() {
            localStorage.setItem('catatan_data_db_v3', JSON.stringify(appData));
            setSyncStatus("⏳ Menyimpan...", "saving");

            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                syncDataToCloud();
            }, 800);
        }

        async function loadDataFromLocal() {
            const local = localStorage.getItem('catatan_data_db_v3');
            if (local) {
                appData = JSON.parse(local);
                applyWallpaperStyle();
            }

            if (JSONBIN_BIN_ID) {
                try {
                    setSyncStatus("🔄 Memuat...", "saving");
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        method: 'GET',
                        headers: { 'X-Master-Key': JSONBIN_API_KEY }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.record) {
                            appData = data.record;
                            localStorage.setItem('catatan_data_db_v3', JSON.stringify(appData));
                            applyWallpaperStyle();
                            setSyncStatus("🟢 Terhubung", "saved");
                        }
                    } else {
                        setSyncStatus("🔴 Offline", "error");
                    }
                } catch (err) {
                    console.error("Gagal muat data cloud:", err);
                    setSyncStatus("🔴 Offline", "error");
                }
            }
        }

        async function syncDataToCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(appData)
                });
                if (res.ok) {
                    setSyncStatus("🟢 Tersimpan", "saved");
                } else {
                    setSyncStatus("🔴 Gagal Sync", "error");
                }
            } catch (err) {
                console.error(err);
                setSyncStatus("🔴 Offline", "error");
            }
        }
    </script>
</body>
</html>
