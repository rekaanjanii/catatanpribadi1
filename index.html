<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKA ANJANI - Dashboard Application</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #120916;
            --card-bg: #1d1026;
            --card-border: #331942;
            --accent-pink: #ff5e97;
            --accent-pink-glow: rgba(255, 94, 151, 0.4);
            --accent-green: #00e676;
            --accent-green-glow: rgba(0, 230, 118, 0.4);
            --text-main: #ffffff;
            --text-sub: #a192b3;
            --input-bg: #0d0612;
            --btn-hover: #e04880;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 950px;
            background: rgba(29, 16, 38, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Header Styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-pink-glow);
        }

        .brand-title i {
            color: var(--accent-pink);
            font-size: 26px;
        }

        .status-badge {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px var(--accent-green-glow);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(13, 6, 18, 0.6);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .nav-btn {
            flex: 1;
            padding: 10px 18px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .nav-btn.active {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 12px var(--accent-pink-glow);
        }

        .nav-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        /* View Layouts */
        .view-panel {
            display: none;
        }

        .view-panel.active {
            display: block;
        }

        /* Button Back */
        .btn-back {
            background: #2a1838;
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover {
            background: #38214a;
        }

        /* --- CALENDAR SECTION --- */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-pink);
        }

        .cal-nav-btn {
            background: #2a1838;
            border: 1px solid var(--card-border);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cal-nav-btn:hover {
            background: var(--accent-pink);
        }

        .calendar-days-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-cell {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            min-height: 75px;
            padding: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .day-cell.empty {
            background: transparent;
            border: none;
        }

        .day-number {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
        }

        /* Checkmark Animation & Blink */
        .has-job-badge {
            align-self: flex-end;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 0 10px var(--accent-green-glow);
            animation: blink-green 1.2s infinite alternate;
        }

        @keyframes blink-green {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 15px var(--accent-green); }
        }

        .job-count-indicator {
            font-size: 10px;
            color: var(--accent-pink);
            font-weight: bold;
            margin-top: 2px;
        }

        /* --- TABEL JADWAL SECTION --- */
        .section-box {
            background: rgba(13, 6, 18, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 8px var(--accent-pink-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent-pink);
            border: none;
            color: #fff;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 0 12px var(--accent-pink-glow);
        }

        .btn-primary:hover {
            background: var(--btn-hover);
        }

        .btn-excel {
            width: 100%;
            padding: 12px;
            background: #107c41;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-excel:hover {
            background: #0b5c30;
        }

        .job-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .job-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
            color: #fff;
        }

        .job-info p {
            font-size: 12px;
            color: var(--text-sub);
        }

        .job-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .job-amount {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 15px;
        }

        .btn-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: var(--input-bg);
            border: 1px solid var(--accent-pink);
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
        }

        /* --- SETTINGS SECTION (COMPLETE) --- */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .settings-card {
            background: rgba(13, 6, 18, 0.5);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
        }

        .settings-card h3 {
            color: var(--accent-pink);
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .setting-item label {
            font-size: 13px;
            color: #ddd;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #331942;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-pink);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- HEADER -->
        <div class="header">
            <div class="brand-title">
                <i class="fa-solid fa-heart"></i>
                <span id="app-title-display">REKA ANJANI</span>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Online Cloud</span>
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('kalender')">
                <i class="fa-solid fa-calendar-days"></i> Kalender
            </button>
            <button class="nav-btn" onclick="switchTab('tabel')">
                <i class="fa-solid fa-table"></i> Tabel Jadwal
            </button>
            <button class="nav-btn" onclick="switchTab('pengaturan')">
                <i class="fa-solid fa-gear"></i> Pengaturan Lengkap
            </button>
        </div>

        <!-- VIEW 1: KALENDER -->
        <div id="view-kalender" class="view-panel active">
            <div class="calendar-header">
                <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="calendar-title" id="month-year-display">Agustus 2026</div>
                <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <div class="calendar-days-header">
                <div>Ming</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>

            <div class="calendar-grid" id="calendar-grid-cells">
                <!-- Dynamic content from JS -->
            </div>
        </div>

        <!-- VIEW 2: TABEL JADWAL -->
        <div id="view-tabel" class="view-panel">
            <button class="btn-excel" onclick="exportToCSV()">
                <i class="fa-solid fa-file-excel"></i> Download Data (.CSV / Excel)
            </button>

            <div class="section-box">
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar"></i> Tanggal Data:</label>
                    <input type="date" id="job-date" class="form-control">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-pen-to-square"></i> Keterangan / Judul / Job:</label>
                    <input type="text" id="job-title" class="form-control" placeholder="Contoh: PERBAUNGAN COFFE / Beli kosmetik">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-money-bill-wave"></i> Jumlah Nominal (Rp):</label>
                    <input type="number" id="job-amount" class="form-control" value="0">
                </div>
                <button class="btn-primary" onclick="addJob()">
                    <i class="fa-solid fa-plus"></i> Tambah Data Baru
                </button>
            </div>

            <div id="job-list-container">
                <!-- Job cards rendered dynamically -->
            </div>

            <div class="total-box">
                <span>Total Keseluruhan:</span>
                <span id="total-amount-display">Rp 0</span>
            </div>
        </div>

        <!-- VIEW 3: PENGATURAN LENGKAP -->
        <div id="view-pengaturan" class="view-panel">
            <h2 style="margin-bottom: 20px; font-size: 18px; color: var(--accent-pink);">
                <i class="fa-solid fa-sliders"></i> Pengaturan Dashboard Lengkap
            </h2>

            <div class="settings-grid">
                <!-- 1. Tampilan & Wallpaper -->
                <div class="settings-card">
                    <h3><i class="fa-solid fa-palette"></i> Tampilan & Background</h3>
                    <div class="form-group">
                        <label>URL Background GIF / Wallpaper Custom:</label>
                        <input type="text" id="cfg-bg-url" class="form-control" placeholder="https://domain.com/animasi.gif">
                    </div>
                    <div class="form-group">
                        <label>Nama Dashboard / Judul Header:</label>
                        <input type="text" id="cfg-app-title" class="form-control" value="REKA ANJANI">
                    </div>
                </div>

                <!-- 2. Fitur Kalender Otomatis -->
                <div class="settings-card">
                    <h3><i class="fa-solid fa-calendar-check"></i> Aturan Kalender & Ceklis Hijau</h3>
                    <div class="setting-item">
                        <label>Otomatis Tampilkan Ceklis Hijau Ketap-Ketip jika ada Job</label>
                        <label class="switch">
                            <input type="checkbox" id="cfg-enable-blink" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>Tampilkan Total Rincian Nominal di Sel Tanggal</label>
                        <label class="switch">
                            <input type="checkbox" id="cfg-show-amount-cal" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- 3. Format Mata Uang & Notifikasi -->
                <div class="settings-card">
                    <h3><i class="fa-solid fa-bell"></i> General & Notifikasi</h3>
                    <div class="form-group">
                        <label>Mata Uang Default:</label>
                        <select id="cfg-currency" class="form-control">
                            <option value="IDR">Rupiah (Rp)</option>
                            <option value="USD">US Dollar ($)</option>
                            <option value="MYR">Ringgit (RM)</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>Notifikasi Suara Saat Add Job / Simpan Data</label>
                        <label class="switch">
                            <input type="checkbox" id="cfg-sound-effect" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- Save Button -->
                <button class="btn-primary" onclick="saveSettings()">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Semua Pengaturan
                </button>
            </div>
        </div>

    </div>

    <script>
        // DATA INITIALIZATION
        let jobs = JSON.parse(localStorage.getItem('reka_jobs')) || [
            { id: 1, date: '2026-09-04', title: 'PERBAUNGAN COFFE', amount: 1000000 }
        ];

        let settings = JSON.parse(localStorage.getItem('reka_settings')) || {
            bgUrl: '',
            appTitle: 'REKA ANJANI',
            enableBlink: true,
            showAmountCal: true,
            currency: 'IDR',
            soundEffect: true
        };

        let currentYear = 2026;
        let currentMonth = 8; // September (0-indexed: 8 = Sep)

        // ON LOAD
        window.onload = function() {
            // Set today in input date
            document.getElementById('job-date').value = '2026-09-04';
            applySettings();
            renderCalendar();
            renderJobList();
        };

        // NAVIGATION SWITCH
        function switchTab(tabName) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            if(tabName === 'kalender') {
                document.getElementById('view-kalender').classList.add('active');
                event.currentTarget.classList.add('active');
                renderCalendar();
            } else if(tabName === 'tabel') {
                document.getElementById('view-tabel').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if(tabName === 'pengaturan') {
                document.getElementById('view-pengaturan').classList.add('active');
                event.currentTarget.classList.add('active');
            }
        }

        // CALENDAR RENDER ENGINE
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid-cells');
            grid.innerHTML = '';

            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            document.getElementById('month-year-display').innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Empty slots for previous month padding
            for(let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            // Fill actual month days
            for(let day = 1; day <= daysInMonth; day++) {
                const formattedDay = day < 10 ? '0' + day : day;
                const formattedMonth = (currentMonth + 1) < 10 ? '0' + (currentMonth + 1) : (currentMonth + 1);
                const dateStr = `${currentYear}-${formattedMonth}-${formattedDay}`;

                const cell = document.createElement('div');
                cell.className = 'day-cell';

                // Check if jobs exist for this date
                const jobsForDate = jobs.filter(j => j.date === dateStr);
                const hasJobs = jobsForDate.length > 0;

                let badgeHTML = '';
                if(hasJobs && settings.enableBlink) {
                    badgeHTML = `<div class="has-job-badge" title="${jobsForDate.length} Job Terdaftar"><i class="fa-solid fa-check"></i></div>`;
                }

                let infoHTML = '';
                if(hasJobs && settings.showAmountCal) {
                    const totalForDay = jobsForDate.reduce((sum, item) => sum + Number(item.amount), 0);
                    infoHTML = `<div class="job-count-indicator">Rp ${totalForDay.toLocaleString('id-ID')}</div>`;
                }

                cell.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <span class="day-number">${day}</span>
                        ${badgeHTML}
                    </div>
                    ${infoHTML}
                `;

                grid.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if(currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if(currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        // JOB MANAGEMENT
        function renderJobList() {
            const container = document.getElementById('job-list-container');
            container.innerHTML = '';

            let total = 0;

            jobs.forEach((job) => {
                total += Number(job.amount);
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <div class="job-info">
                        <h4>${job.title}</h4>
                        <p><i class="fa-solid fa-calendar"></i> ${job.date}</p>
                    </div>
                    <div class="job-right">
                        <span class="job-amount">Rp ${Number(job.amount).toLocaleString('id-ID')}</span>
                        <button class="btn-delete" onclick="deleteJob(${job.id})">Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('total-amount-display').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function addJob() {
            const date = document.getElementById('job-date').value;
            const title = document.getElementById('job-title').value;
            const amount = document.getElementById('job-amount').value;

            if(!date || !title) {
                alert('Mohon isi tanggal dan keterangan job!');
                return;
            }

            const newJob = {
                id: Date.now(),
                date: date,
                title: title,
                amount: parseFloat(amount) || 0
            };

            jobs.push(newJob);
            localStorage.setItem('reka_jobs', JSON.stringify(jobs));

            document.getElementById('job-title').value = '';
            document.getElementById('job-amount').value = '0';

            renderJobList();
            renderCalendar();
            alert('Data job berhasil ditambahkan!');
        }

        function deleteJob(id) {
            jobs = jobs.filter(j => j.id !== id);
            localStorage.setItem('reka_jobs', JSON.stringify(jobs));
            renderJobList();
            renderCalendar();
        }

        // SETTINGS ENGINE
        function saveSettings() {
            settings.bgUrl = document.getElementById('cfg-bg-url').value;
            settings.appTitle = document.getElementById('cfg-app-title').value;
            settings.enableBlink = document.getElementById('cfg-enable-blink').checked;
            settings.showAmountCal = document.getElementById('cfg-show-amount-cal').checked;
            settings.currency = document.getElementById('cfg-currency').value;
            settings.soundEffect = document.getElementById('cfg-sound-effect').checked;

            localStorage.setItem('reka_settings', JSON.stringify(settings));
            applySettings();
            alert('Pengaturan berhasil disimpan!');
        }

        function applySettings() {
            document.getElementById('app-title-display').innerText = settings.appTitle || 'REKA ANJANI';
            
            if(settings.bgUrl) {
                document.body.style.backgroundImage = `url('${settings.bgUrl}')`;
            } else {
                document.body.style.backgroundImage = 'none';
            }

            document.getElementById('cfg-bg-url').value = settings.bgUrl || '';
            document.getElementById('cfg-app-title').value = settings.appTitle || 'REKA ANJANI';
            document.getElementById('cfg-enable-blink').checked = settings.enableBlink;
            document.getElementById('cfg-show-amount-cal').checked = settings.showAmountCal;
            document.getElementById('cfg-currency').value = settings.currency;
            document.getElementById('cfg-sound-effect').checked = settings.soundEffect;
        }

        // EXPORT TO CSV
        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,ID,Tanggal,Keterangan / Job,Nominal
";
            jobs.forEach(j => {
                csvContent += `${j.id},${j.date},"${j.title}",${j.amount}
`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Tabel_Jadwal_RekaAnjani.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
