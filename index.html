<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Data Premium Dashboard</title>
    <style>
        :root {
            --bg-base: #110d18;
            --accent-color: #ff6b8b;
            --accent-glow: rgba(255, 107, 139, 0.47);
            --card-bg: rgba(35, 22, 45, 0.85);
            --text-muted: #f3c2d8;
            --success: #00ff88;
            --danger: #ff4757;
            --warning: #ffa500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            opacity: var(--wallpaper-brightness, 0.7);
            transition: opacity 0.3s ease;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            min-height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 20px;
        }

        /* HEADER */
        .app-header {
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .sync-badge {
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .sync-badge.saved { border-color: var(--success); color: var(--success); }
        .sync-badge.saving { border-color: var(--warning); color: var(--warning); }
        .sync-badge.error { border-color: var(--danger); color: var(--danger); }

        /* BODY CONTENT */
        .app-body {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .page-view {
            display: none;
        }
        .page-view.active {
            display: block;
        }

        /* DASHBOARD CLOCK & MENU */
        .dashboard-hero {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 25px;
        }
        .dashboard-date {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .dashboard-clock {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 10px;
            border-radius: 15px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .menu-btn:hover {
            background: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        /* FORM INPUTS & CARDS */
        .form-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
        .form-control:focus {
            border-color: var(--accent-color);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-green {
            background: #2ed573;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }

        .data-card-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .data-info .data-primary { font-weight: bold; font-size: 0.95rem; }
        .data-info .data-secondary { font-size: 0.75rem; color: var(--text-muted); }
        .data-amount { font-weight: bold; color: var(--success); }

        .btn-delete {
            background: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* CALENDAR */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 15px;
        }
        .calendar-day-cell {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 50px;
            padding: 5px;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        .calendar-day-cell.has-job {
            border-color: var(--success);
            background: rgba(0, 255, 136, 0.1);
        }

        /* THEME GRID */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .theme-option-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.75rem;
        }
        .theme-option-card.selected {
            border-color: var(--accent-color);
            background: rgba(255,255,255,0.1);
        }
        .theme-color-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 5px;
        }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; }

        /* OVERLAY LOGIN */
        #login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 15, 0.95);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        #login-overlay.hidden { display: none; }
        .login-box {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div class="app-container">
        <!-- LOGIN OVERLAY -->
        <div id="login-overlay">
            <div class="login-box">
                <h2 style="margin-bottom: 20px; color: var(--accent-color);">ADMIN LOGIN</h2>
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username">
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password">
                </div>
                <button class="btn-primary" onclick="login()">Masuk</button>
                <div id="login-error" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px;"></div>
            </div>
        </div>

        <!-- HEADER -->
        <div class="app-header">
            <div class="app-title">CATATAN DATA</div>
            <div id="sync-indicator" class="sync-badge saving">⏳ Memuat Cloud...</div>
        </div>

        <!-- BODY PAGES -->
        <div class="app-body">
            
            <!-- PAGE: DASHBOARD -->
            <div id="page-dashboard" class="page-view active">
                <div class="dashboard-hero">
                    <div id="dashboard-date-text" class="dashboard-date">-</div>
                    <div id="dashboard-clock-text" class="dashboard-clock">00:00:00 WIB</div>
                </div>

                <div class="menu-grid">
                    <button class="menu-btn" onclick="navigateTo('pemasukkan')">📥 Pemasukkan</button>
                    <button class="menu-btn" onclick="navigateTo('pengeluaran')">📤 Pengeluaran</button>
                    <button class="menu-btn" onclick="navigateTo('jadwal')">📅 Jadwal</button>
                    <button class="menu-btn" onclick="navigateTo('utang')">💳 Utang / Piutang</button>
                    <button class="menu-btn" onclick="navigateTo('simpanan')">🏦 Simpanan</button>
                    <button class="menu-btn" onclick="navigateTo('calendar')">🗓️ Kalender</button>
                    <button class="menu-btn" onclick="navigateTo('settings')">⚙️ Pengaturan</button>
                    <button class="menu-btn" onclick="logout()" style="border-color: var(--danger);">🔒 Keluar</button>
                </div>
            </div>

            <!-- PAGE: DATA VIEWER (SHARED FOR CATEGORIES) -->
            <div id="page-data" class="page-view">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                    <div id="current-page-title" style="font-weight: bold; text-transform: uppercase;">Tabel Data</div>
                </div>

                <button class="btn-green" onclick="downloadCSVData()">📊 Download Data File (.CSV / Excel)</button>

                <div class="form-card">
                    <div class="form-group">
                        <label>Tanggal Data:</label>
                        <input type="date" id="input-date" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Keterangan / Job:</label>
                        <input type="text" id="input-desc" class="form-control" placeholder="Contoh: Pembayaran Job / Beli barang">
                    </div>
                    <div class="form-group">
                        <label>Jumlah Nominal (Rp):</label>
                        <input type="number" id="input-amount" class="form-control" placeholder="0">
                    </div>
                    <button class="btn-primary" onclick="addDataItem()">➕ Tambah Data</button>
                </div>

                <div id="data-list-container"></div>

                <div style="margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 10px; display: flex; justify-content: space-between; font-weight: bold;">
                    <span>Total:</span>
                    <span id="total-amount-val" style="color: var(--success);">Rp 0</span>
                </div>
            </div>

            <!-- PAGE: CALENDAR -->
            <div id="page-calendar" class="page-view">
                <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <button class="btn-back" onclick="changeMonth(-1)">◀</button>
                    <h3 id="calendar-month-year">Bulan Tahun</h3>
                    <button class="btn-back" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="calendar-grid" id="calendar-days-container"></div>
            </div>

            <!-- PAGE: SETTINGS -->
            <div id="page-settings" class="page-view">
                <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                <h3>Pengaturan Dashboard</h3>
                <br>
                <div class="form-card">
                    <label>Pilih Varian Tema (50 Varian Feminim):</label>
                    <div class="theme-grid" id="theme-grid"></div>
                </div>

                <div class="form-card">
                    <div class="form-group">
                        <label>URL Image Background Wallpaper:</label>
                        <input type="text" id="wallpaper-url-input" class="form-control" placeholder="https://domain.com/gambar.jpg">
                    </div>
                    <div class="form-group">
                        <label>Atau Upload Wallpaper (Lokal):</label>
                        <input type="file" id="wallpaper-file-input" class="form-control" accept="image/*" onchange="handleWallpaperUpload(event)">
                    </div>
                    <div class="form-group">
                        <label>Kecerahan Gambar Wallpaper (%):</label>
                        <input type="range" id="val-brightness" min="10" max="100" value="70" style="width: 100%;">
                    </div>
                    <button class="btn-primary" onclick="confirmSaveSettings()">💾 Simpan Pengaturan</button>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT CLOUD PREMIER ENGINE (JSONBIN V3 + HYBRID LOCAL ENGINE) -->
    <script>
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        // JSONBin Cloud Credentials
        const JSONBIN_BIN_ID = "6a9a2cdbf5f4af5e296817f7";
        const JSONBIN_API_KEY = "$2a$10$RToIDZQyfCwAmmFIgopn6O1Nf2lOWMZy5cE7zwXLMHjagMg0EP5I.";
        const JSONBIN_ENDPOINT = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        const FEMININE_THEMES = Array.from({ length: 50 }, (_, i) => {
            const hue = (i * 7.2) % 360;
            return {
                id: i + 1,
                name: `Tema Varian ${i + 1}`,
                bg: `hsl(${hue}, 35%, 8%)`,
                accent: `hsl(${hue}, 85%, 65%)`,
                card: `hsla(${hue}, 30%, 15%, 0.85)`,
                textMuted: `hsl(${hue}, 70%, 85%)`
            };
        });

        let tempSelectedThemeId = 1;
        let tempUploadedWallpaper = "";

        let appData = {
            settings: { themeId: 1, wallpaper: "", brightness: 70 },
            pemasukkan: [],
            pengeluaran: [],
            jadwal: [],
            utang: [],
            simpanan: []
        };

        let activeCategory = 'pemasukkan';
        let currentCalendarDate = new Date();

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('is_admin_logged_in') === 'true') {
                document.getElementById('login-overlay').classList.add('hidden');
            }
            document.getElementById('input-date').valueAsDate = new Date();
            startDashboardClock();
            
            // 1. Muat data lokal instan
            loadLocalBackup();
            
            // 2. Tarik data terbaru dari Cloud JSONBin
            loadOnlineData();
        });

        function startDashboardClock() {
            function updateClock() {
                const now = new Date();
                const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                
                document.getElementById('dashboard-date-text').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
                document.getElementById('dashboard-clock-text').innerText = `Jam: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} WIB`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function setSyncStatus(text, statusClass) {
            const el = document.getElementById('sync-indicator');
            if(el) {
                el.innerText = text;
                el.className = `sync-badge ${statusClass}`;
            }
        }

        // ==========================================
        // HYBRID STORAGE ENGINES
        // ==========================================
        function saveLocalBackup() {
            localStorage.setItem('catatan_data_app_db_v2', JSON.stringify(appData));
        }

        function loadLocalBackup() {
            const local = localStorage.getItem('catatan_data_app_db_v2');
            if (local) {
                try {
                    appData = JSON.parse(local);
                    tempSelectedThemeId = appData.settings.themeId || 1;
                    applyThemeStyle();
                    if (document.getElementById('page-data').classList.contains('active')) {
                        renderCategoryView();
                    }
                } catch(e) {
                    console.error("Format data lokal tidak valid", e);
                }
            }
        }

        async function loadOnlineData() {
            setSyncStatus("⏳ Sinkronisasi Cloud...", "saving");
            try {
                const res = await fetch(`${JSONBIN_ENDPOINT}/latest`, {
                    method: 'GET',
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });

                if (res.ok) {
                    const result = await res.json();
                    if (result.record && typeof result.record === 'object') {
                        appData = result.record;
                        saveLocalBackup();
                        tempSelectedThemeId = appData.settings.themeId || 1;
                        applyThemeStyle();
                        if (document.getElementById('page-data').classList.contains('active')) {
                            renderCategoryView();
                        }
                        setSyncStatus("🟢 Online Cloud", "saved");
                    }
                } else {
                    setSyncStatus("🟡 Mode Lokal (Aman)", "saved");
                }
            } catch (e) {
                setSyncStatus("🟡 Mode Lokal (Aman)", "saved");
            }
        }

        async function saveOnlineData() {
            // Simpan instant ke Local Storage
            saveLocalBackup();

            setSyncStatus("⏳ Menyimpan...", "saving");
            try {
                const res = await fetch(JSONBIN_ENDPOINT, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(appData)
                });

                if (res.ok) {
                    setSyncStatus("🟢 Tersimpan Online", "saved");
                } else {
                    setSyncStatus("🟡 Tersimpan di HP/Lokal", "saved");
                }
            } catch (e) {
                setSyncStatus("🟡 Tersimpan di HP/Lokal", "saved");
            }
        }

        // ==========================================
        // AUTH & NAVIGATION
        // ==========================================
        function login() {
            if (document.getElementById('username').value === ADMIN_USER && document.getElementById('password').value === ADMIN_PASS) {
                localStorage.setItem('is_admin_logged_in', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
                loadOnlineData();
            } else {
                document.getElementById('login-error').innerText = "Username/Password Salah!";
            }
        }

        function logout() {
            localStorage.removeItem('is_admin_logged_in');
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function navigateTo(targetPage) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));

            if (targetPage === 'dashboard') {
                document.getElementById('page-dashboard').classList.add('active');
            } else if (targetPage === 'settings') {
                document.getElementById('page-settings').classList.add('active');
                tempSelectedThemeId = appData.settings.themeId || 1;
                renderThemeGrid();
                loadSettingsUI();
            } else if (targetPage === 'calendar') {
                document.getElementById('page-calendar').classList.add('active');
                renderCalendarView();
            } else {
                activeCategory = targetPage;
                document.getElementById('page-data').classList.add('active');
                document.getElementById('current-page-title').innerText = "Tabel " + targetPage.toUpperCase();
                renderCategoryView();
            }
        }

        // ==========================================
        // THEME & SETTINGS
        // ==========================================
        function renderThemeGrid() {
            const grid = document.getElementById('theme-grid');
            grid.innerHTML = '';
            FEMININE_THEMES.forEach(t => {
                const card = document.createElement('div');
                card.className = `theme-option-card ${t.id === tempSelectedThemeId ? 'selected' : ''}`;
                card.onclick = () => {
                    tempSelectedThemeId = t.id;
                    renderThemeGrid();
                };
                card.innerHTML = `
                    <div class="theme-color-dots">
                        <div class="color-dot" style="background:${t.accent};"></div>
                        <div class="color-dot" style="background:${t.card}; border:1px solid #fff;"></div>
                    </div>
                    <div>#${t.id} ${t.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function handleWallpaperUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 350;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    tempUploadedWallpaper = canvas.toDataURL('image/jpeg', 0.3);
                    alert("Wallpaper dipilih! Klik 'Simpan Pengaturan' untuk menerapkan.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function loadSettingsUI() {
            document.getElementById('wallpaper-url-input').value = appData.settings.wallpaper.startsWith('data:') ? '' : (appData.settings.wallpaper || '');
            document.getElementById('val-brightness').value = appData.settings.brightness || 70;
            tempUploadedWallpaper = "";
        }

        function confirmSaveSettings() {
            appData.settings.themeId = tempSelectedThemeId;
            const urlInput = document.getElementById('wallpaper-url-input').value.trim();

            if (tempUploadedWallpaper !== "") {
                appData.settings.wallpaper = tempUploadedWallpaper;
            } else if (urlInput !== "") {
                appData.settings.wallpaper = urlInput;
            }

            appData.settings.brightness = document.getElementById('val-brightness').value;

            applyThemeStyle();
            saveOnlineData();
            alert("✅ Pengaturan Berhasil Disimpan!");
        }

        function applyThemeStyle() {
            const t = FEMININE_THEMES.find(x => x.id === (appData.settings.themeId || 1)) || FEMININE_THEMES[0];
            document.documentElement.style.setProperty('--bg-base', t.bg);
            document.documentElement.style.setProperty('--accent-color', t.accent);
            document.documentElement.style.setProperty('--accent-glow', `${t.accent}77`);
            document.documentElement.style.setProperty('--card-bg', t.card);
            document.documentElement.style.setProperty('--text-muted', t.textMuted);

            const bgLayer = document.getElementById('bg-layer');
            if (appData.settings.wallpaper) {
                bgLayer.style.backgroundImage = `url('${appData.settings.wallpaper}')`;
                bgLayer.style.setProperty('--wallpaper-brightness', (appData.settings.brightness || 70) / 100);
            } else {
                bgLayer.style.backgroundImage = "none";
            }
        }

        // ==========================================
        // DATA MANIPULATION (ADD / DELETE / RENDER)
        // ==========================================
        function addDataItem() {
            const date = document.getElementById('input-date').value;
            const desc = document.getElementById('input-desc').value.trim();
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;

            if (!date || !desc) {
                alert("Harap isi tanggal dan keterangan!");
                return;
            }

            if (!appData[activeCategory]) {
                appData[activeCategory] = [];
            }

            const newItem = { id: Date.now(), date, desc, amount };
            appData[activeCategory].push(newItem);

            document.getElementById('input-desc').value = '';
            document.getElementById('input-amount').value = '';

            renderCategoryView();
            saveOnlineData();
        }

        function deleteDataItem(id) {
            appData[activeCategory] = appData[activeCategory].filter(x => x.id !== id);
            renderCategoryView();
            saveOnlineData();
        }

        function renderCategoryView() {
            const container = document.getElementById('data-list-container');
            container.innerHTML = '';
            let total = 0;

            const items = appData[activeCategory] || [];

            if (items.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.9rem;">Belum ada data untuk kategori ini.</div>`;
            } else {
                items.forEach(item => {
                    total += item.amount;
                    const card = document.createElement('div');
                    card.className = 'data-card-item';
                    card.innerHTML = `
                        <div class="data-info">
                            <div class="data-primary">${item.desc}</div>
                            <div class="data-secondary">📅 ${item.date}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="data-amount">Rp ${item.amount.toLocaleString('id-ID')}</div>
                            <button class="btn-delete" onclick="deleteDataItem(${item.id})">Hapus</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            document.getElementById('total-amount-val').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function downloadCSVData() {
            const items = appData[activeCategory] || [];
            if (items.length === 0) {
                alert("Tidak ada data untuk di-download!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Tanggal,Keterangan,Nominal\n";
            items.forEach(row => {
                csvContent += `"${row.date}","${row.desc}","${row.amount}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Data_${activeCategory.toUpperCase()}_ADMIN.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ==========================================
        // CALENDAR VIEW
        // ==========================================
        function renderCalendarView() {
            const container = document.getElementById('calendar-days-container');
            const label = document.getElementById('calendar-month-year');
            container.innerHTML = '';

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            label.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const jobDates = new Set();
            [...(appData.jadwal || []), ...(appData.pemasukkan || [])].forEach(item => {
                if (item.date) jobDates.add(item.date);
            });

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day-cell';
                emptyCell.style.border = 'none';
                container.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                cell.innerText = day;

                if (jobDates.has(dayString)) {
                    cell.classList.add('has-job');
                    cell.innerHTML += `<span style="font-size:0.65rem; color:var(--success);">✓ Job</span>`;
                }
                container.appendChild(cell);
            }
        }

        function changeMonth(step) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + step);
            renderCalendarView();
        }
    </script>
</body>
</html>
