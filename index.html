<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CATATAN DATA - ADMIN ADVANCED</title>
    <style>
        :root {
            --accent-color: #7239ea;
            --text-color: #ffffff;
            --text-muted: #e1e1e1;
            --success: #50cd89;
            --danger: #f1416c;
            
            /* Dynamic Theme Variables */
            --glass-bg-opacity: 0.45;
            --glass-blur-val: 16px;
            --wallpaper-brightness: 70%;
            --wallpaper-size: cover;
            --wallpaper-zoom: 100%;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0d0e15;
            color: var(--text-color); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* Background Layer */
        #bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: var(--wallpaper-size);
            filter: brightness(var(--wallpaper-brightness));
            transition: background-image 0.5s ease, filter 0.3s ease;
            z-index: 1;
        }

        /* Layout Container */
        .app-container {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 999;
            padding: 20px;
        }
        .login-box {
            background: rgba(30, 30, 50, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 30px 20px; border-radius: 15px; 
            width: 100%; max-width: 340px; text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .login-box h2 { margin-bottom: 20px; color: var(--accent-color); text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 1.4rem; }
        .login-box input {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5); color: #fff; outline: none; font-size: 1rem;
        }
        .login-box button {
            width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px;
            background: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        /* Sidebar Navigasi (Desktop) */
        .sidebar {
            width: 260px; 
            background: rgba(20, 20, 35, var(--glass-bg-opacity)); 
            backdrop-filter: blur(var(--glass-blur-val));
            display: flex; flex-direction: column; border-right: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        .sidebar-header h3 { color: var(--text-color); font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .menu { list-style: none; padding: 15px 0; flex-grow: 1; overflow-y: auto; }
        .menu li {
            padding: 12px 20px; cursor: pointer; color: var(--text-muted); font-weight: 500;
            transition: 0.3s; display: flex; align-items: center; justify-content: space-between;
        }
        .menu li:hover, .menu li.active { background: rgba(255, 255, 255, 0.2); color: var(--text-color); border-left: 4px solid var(--accent-color); }
        
        /* Main Content */
        .main-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; width: 100%; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .page-title { font-size: 1.4rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* Status Sync Indicator */
        .sync-status {
            font-size: 0.8rem; padding: 6px 12px; border-radius: 20px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-muted); transition: all 0.3s ease; font-weight: bold;
            white-space: nowrap;
        }
        .sync-status.saving { color: #ffc107; border-color: #ffc107; }
        .sync-status.saved { color: var(--success); border-color: var(--success); }
        .sync-status.error { color: var(--danger); border-color: var(--danger); }

        /* Panel Kontrol Pengaturan Wallpaper */
        .admin-controls {
            background: rgba(30, 30, 50, var(--glass-bg-opacity)); 
            backdrop-filter: blur(var(--glass-blur-val));
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 12px; margin-bottom: 20px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
        .control-group label { font-size: 0.75rem; color: var(--text-muted); }
        .control-group input[type="text"], .control-group select {
            padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0,0,0,0.4); color: #fff; outline: none; font-size: 0.85rem; width: 100%;
        }
        .control-group input[type="range"] { accent-color: var(--accent-color); cursor: pointer; width: 100%; }

        /* Form Inputs & Tables */
        .form-inline { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-inline input {
            padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(var(--glass-blur-val)); color: #fff; flex: 1; min-width: 140px; outline: none; font-size: 0.9rem;
        }
        .form-inline input::placeholder { color: #bbb; }
        .btn {
            padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 0.9rem;
        }
        .btn-primary { background: var(--accent-color); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* Table Container Responsif */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(30, 30, 50, var(--glass-bg-opacity)); 
            backdrop-filter: blur(var(--glass-blur-val));
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.85rem; }
        th { background: rgba(0, 0, 0, 0.5); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        tr:hover { background: rgba(255, 255, 255, 0.1); }
        
        .total-card {
            margin-top: 15px; padding: 15px; 
            background: rgba(30, 30, 50, var(--glass-bg-opacity)); 
            backdrop-filter: blur(var(--glass-blur-val));
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
            text-align: right; font-size: 1.1rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .status-badge {
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; user-select: none; display: inline-block; font-weight: bold; white-space: nowrap;
        }
        .status-pending { background: rgba(255, 199, 0, 0.8); color: #000; }
        .status-done { background: rgba(80, 205, 137, 0.85); color: #fff; }

        .hidden { display: none !important; }

        .file-upload-btn {
            padding: 8px 10px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; text-align: center; display: block; width: 100%;
        }

        /* CSS KHUSUS UNTUK TAMPILAN HP / MOBILE (Screen Width < 768px) */
        @media screen and (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.15);
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }

            .sidebar-header {
                padding: 12px;
            }

            .sidebar-header h3 {
                font-size: 1.1rem;
            }

            .menu {
                display: flex;
                overflow-x: auto;
                padding: 0;
                white-space: nowrap;
            }

            .menu li {
                padding: 10px 14px;
                font-size: 0.85rem;
                border-left: none !important;
                border-bottom: 3px solid transparent;
                flex-shrink: 0;
            }

            .menu li:hover, .menu li.active {
                border-bottom: 3px solid var(--accent-color);
                background: rgba(255, 255, 255, 0.1);
            }

            .sidebar div:last-child {
                display: none; /* Sembunyikan tombol logout bawah di mobile */
            }

            .mobile-logout-btn {
                display: inline-block !important;
            }

            .main-content {
                padding: 15px;
            }

            .header-bar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .page-title {
                font-size: 1.2rem;
            }

            .form-inline {
                flex-direction: column;
                gap: 8px;
            }

            .form-inline input, .form-inline button {
                width: 100%;
            }

            .admin-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                width: 100%;
            }

            th, td {
                padding: 10px 12px;
            }
        }

        .mobile-logout-btn {
            display: none;
            padding: 6px 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Layer Background Wallpaper -->
    <div id="bg-layer"></div>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>LOGIN ADMIN</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">MASUK</button>
            <p id="login-error" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- Layout Utama -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h3>CATATAN DATA</h3>
                <button class="btn btn-danger mobile-logout-btn" onclick="logout()">Logout</button>
            </div>
            <ul class="menu">
                <li class="active" onclick="switchTab('pemasukkan')">Pemasukkan</li>
                <li onclick="switchTab('pengeluaran')">Pengeluaran</li>
                <li onclick="switchTab('jadwal')">Jadwal Job</li>
                <li onclick="switchTab('utang')">Utang / Piutang</li>
                <li onclick="switchTab('simpanan')">Simpanan</li>
            </ul>
            <div style="padding: 15px;">
                <button class="btn btn-danger" style="width: 100%;" onclick="logout()">Logout Admin</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header-bar">
                <h2 class="page-title" id="page-title">Tabel Pemasukkan</h2>
                <div id="sync-indicator" class="sync-status">🟢 Terhubung</div>
            </div>

            <!-- Panel Pengaturan Wallpaper Halaman Ini -->
            <div class="admin-controls">
                <div class="control-group">
                    <label>Wallpaper Halaman Ini (Galeri):</label>
                    <label for="wallpaper-file" class="file-upload-btn">📁 Unggah Foto</label>
                    <input type="file" id="wallpaper-file" accept="image/*" style="display: none;" onchange="uploadWallpaper(event)">
                </div>
                <div class="control-group">
                    <label>Atau Link Gambar:</label>
                    <input type="text" id="wallpaper-url" placeholder="https://..." onchange="setWallpaperURL(this.value)">
                </div>
                <div class="control-group">
                    <label>Kecerahan Wallpaper:</label>
                    <input type="range" id="val-brightness" min="20" max="100" value="70" onchange="updateWallpaperSettings()" oninput="previewWallpaperBrightness(this.value)">
                </div>
                <div class="control-group">
                    <label>Transparansi Tabel:</label>
                    <input type="range" id="val-opacity" min="10" max="90" value="45" onchange="updateWallpaperSettings()" oninput="previewTableOpacity(this.value)">
                </div>
                <div class="control-group">
                    <label>Ukuran / Skala Wallpaper:</label>
                    <select id="val-size" onchange="updateWallpaperSettings()">
                        <option value="cover">Penuh Layar (Cover)</option>
                        <option value="contain">Pas Gambar (Contain)</option>
                        <option value="100% 100%">Regangkan (Stretch)</option>
                    </select>
                </div>
            </div>

            <!-- Form Input Dynamic -->
            <div class="form-inline" id="form-container">
                <!-- Form Dinamis JS -->
            </div>

            <!-- Table View Responsif -->
            <div class="table-responsive">
                <table id="data-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <div class="total-card" id="total-container">
                Total: <span id="total-val" style="color: var(--success);">Rp 0</span>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        const JSONBIN_BIN_ID = "6a97e858f5f4af5e296025b0"; 
        const JSONBIN_API_KEY = "$2a$10$RToIDZQyfCwAmmFIgopn6O1Nf2lOWMZy5cE7zwXLMHjagMg0EP5I."; 

        let appData = {
            pageSettings: {
                pemasukkan: { wallpaper: "", brightness: 70, opacity: 45, size: "cover" },
                pengeluaran: { wallpaper: "", brightness: 70, opacity: 45, size: "cover" },
                jadwal: { wallpaper: "", brightness: 70, opacity: 45, size: "cover" },
                utang: { wallpaper: "", brightness: 70, opacity: 45, size: "cover" },
                simpanan: { wallpaper: "", brightness: 70, opacity: 45, size: "cover" }
            },
            pemasukkan: [],
            pengeluaran: [],
            jadwal: [],
            utang: [],
            simpanan: []
        };

        let activeTab = 'pemasukkan';
        let autoSaveTimer = null;

        // Mengecek status login saat pertama kali halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('is_admin_logged_in');
            if (isLoggedIn === 'true') {
                document.getElementById('login-overlay').classList.add('hidden');
                loadDataFromLocal();
            }
        });

        function setSyncStatus(text, statusClass) {
            const el = document.getElementById('sync-indicator');
            el.innerText = text;
            el.className = `sync-status ${statusClass}`;
        }

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem('is_admin_logged_in', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('login-error').innerText = "";
                loadDataFromLocal();
            } else {
                document.getElementById('login-error').innerText = "Username atau Password Salah!";
            }
        }

        function logout() {
            localStorage.removeItem('is_admin_logged_in');
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.menu li').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const titles = {
                pemasukkan: 'Tabel Pemasukkan',
                pengeluaran: 'Tabel Pengeluaran',
                jadwal: 'Jadwal Job',
                utang: 'Utang / Piutang',
                simpanan: 'Rekapan Data Simpanan'
            };
            document.getElementById('page-title').innerText = titles[tab];
            
            loadPageSettings();
            renderView();
        }

        function uploadWallpaper(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgBase64 = e.target.result;
                    appData.pageSettings[activeTab].wallpaper = imgBase64;
                    applyCurrentPageStyle();
                    saveAndAutoSync();
                };
                reader.readAsDataURL(file);
            }
        }

        function setWallpaperURL(url) {
            appData.pageSettings[activeTab].wallpaper = url;
            applyCurrentPageStyle();
            saveAndAutoSync();
        }

        function previewWallpaperBrightness(val) {
            document.documentElement.style.setProperty('--wallpaper-brightness', `${val}%`);
        }

        function previewTableOpacity(val) {
            document.documentElement.style.setProperty('--glass-bg-opacity', val / 100);
        }

        function updateWallpaperSettings() {
            const brightness = document.getElementById('val-brightness').value;
            const opacity = document.getElementById('val-opacity').value;
            const size = document.getElementById('val-size').value;

            appData.pageSettings[activeTab].brightness = brightness;
            appData.pageSettings[activeTab].opacity = opacity;
            appData.pageSettings[activeTab].size = size;

            applyCurrentPageStyle();
            saveAndAutoSync();
        }

        function loadPageSettings() {
            const cfg = appData.pageSettings[activeTab] || { brightness: 70, opacity: 45, size: "cover" };
            document.getElementById('val-brightness').value = cfg.brightness || 70;
            document.getElementById('val-opacity').value = cfg.opacity || 45;
            document.getElementById('val-size').value = cfg.size || "cover";
            document.getElementById('wallpaper-url').value = cfg.wallpaper && !cfg.wallpaper.startsWith('data:image') ? cfg.wallpaper : "";

            applyCurrentPageStyle();
        }

        function applyCurrentPageStyle() {
            const cfg = appData.pageSettings[activeTab] || { brightness: 70, opacity: 45, size: "cover" };
            const bgLayer = document.getElementById('bg-layer');

            if (cfg.wallpaper) {
                bgLayer.style.backgroundImage = `url('${cfg.wallpaper}')`;
            } else {
                bgLayer.style.backgroundImage = 'none';
            }

            document.documentElement.style.setProperty('--wallpaper-brightness', `${cfg.brightness}%`);
            document.documentElement.style.setProperty('--glass-bg-opacity', cfg.opacity / 100);
            document.documentElement.style.setProperty('--wallpaper-size', cfg.size);
        }

        function renderView() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            const form = document.getElementById('form-container');
            const totalContainer = document.getElementById('total-container');

            head.innerHTML = '';
            body.innerHTML = '';
            form.innerHTML = '';

            if (activeTab === 'pemasukkan' || activeTab === 'pengeluaran' || activeTab === 'simpanan') {
                totalContainer.classList.remove('hidden');
                head.innerHTML = `<tr><th>Tanggal</th><th>Nama</th><th>Jumlah / Harga</th><th>Aksi</th></tr>`;
                form.innerHTML = `
                    <input type="date" id="inp-date">
                    <input type="text" id="inp-name" placeholder="Nama / Keterangan">
                    <input type="number" id="inp-amount" placeholder="Harga / Jumlah (Rp)">
                    <button class="btn btn-primary" onclick="addData()">Tambah Data</button>
                `;
            } else if (activeTab === 'utang') {
                totalContainer.classList.remove('hidden');
                head.innerHTML = `<tr><th>Nama</th><th>Harga / Total</th><th>Aksi</th></tr>`;
                form.innerHTML = `
                    <input type="text" id="inp-name" placeholder="Nama">
                    <input type="number" id="inp-amount" placeholder="Harga / Nominal (Rp)">
                    <button class="btn btn-primary" onclick="addData()">Tambah Data</button>
                `;
            } else if (activeTab === 'jadwal') {
                totalContainer.classList.add('hidden');
                head.innerHTML = `<tr><th>Nama Tempat / Resto</th><th>Lokasi</th><th>Tanggal Update</th><th>Status</th><th>Aksi</th></tr>`;
                form.innerHTML = `
                    <input type="text" id="inp-name" placeholder="Nama Tempat/Outlet/Resto">
                    <input type="text" id="inp-loc" placeholder="Lokasi">
                    <input type="date" id="inp-date">
                    <button class="btn btn-primary" onclick="addData()">Tambah Job</button>
                `;
            }

            let total = 0;
            if (appData[activeTab]) {
                appData[activeTab].forEach((item, index) => {
                    const tr = document.createElement('tr');
                    if (activeTab === 'pemasukkan' || activeTab === 'pengeluaran' || activeTab === 'simpanan') {
                        total += Number(item.amount);
                        tr.innerHTML = `
                            <td>${item.date}</td>
                            <td>${item.name}</td>
                            <td>Rp ${Number(item.amount).toLocaleString('id-ID')}</td>
                            <td><button class="btn btn-danger" onclick="deleteData(${index})">Hapus</button></td>
                        `;
                    } else if (activeTab === 'utang') {
                        total += Number(item.amount);
                        tr.innerHTML = `
                            <td>${item.name}</td>
                            <td>Rp ${Number(item.amount).toLocaleString('id-ID')}</td>
                            <td><button class="btn btn-danger" onclick="deleteData(${index})">Hapus</button></td>
                        `;
                    } else if (activeTab === 'jadwal') {
                        const statusClass = item.status === 'Selesai' ? 'status-done' : 'status-pending';
                        const statusIcon = item.status === 'Selesai' ? '✔ Selesai' : '⏳ Pending (Klik)';
                        tr.innerHTML = `
                            <td>${item.name}</td>
                            <td>${item.loc}</td>
                            <td>${item.date}</td>
                            <td><span class="status-badge ${statusClass}" onclick="toggleStatus(${index})">${statusIcon}</span></td>
                            <td><button class="btn btn-danger" onclick="deleteData(${index})">Hapus</button></td>
                        `;
                    }
                    body.appendChild(tr);
                });
            }

            document.getElementById('total-val').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function addData() {
            let item = {};
            if (activeTab === 'pemasukkan' || activeTab === 'pengeluaran' || activeTab === 'simpanan') {
                const date = document.getElementById('inp-date').value;
                const name = document.getElementById('inp-name').value;
                const amount = document.getElementById('inp-amount').value;
                if (!date || !name || !amount) return alert("Isi semua bidang!");
                item = { date, name, amount: Number(amount) };
            } else if (activeTab === 'utang') {
                const name = document.getElementById('inp-name').value;
                const amount = document.getElementById('inp-amount').value;
                if (!name || !amount) return alert("Isi semua bidang!");
                item = { name, amount: Number(amount) };
            } else if (activeTab === 'jadwal') {
                const name = document.getElementById('inp-name').value;
                const loc = document.getElementById('inp-loc').value;
                const date = document.getElementById('inp-date').value;
                if (!name || !loc || !date) return alert("Isi semua bidang!");
                item = { name, loc, date, status: 'Pending' };
            }

            appData[activeTab].push(item);
            saveAndAutoSync();
            renderView();
        }

        function deleteData(index) {
            appData[activeTab].splice(index, 1);
            saveAndAutoSync();
            renderView();
        }

        function toggleStatus(index) {
            appData.jadwal[index].status = appData.jadwal[index].status === 'Selesai' ? 'Pending' : 'Selesai';
            saveAndAutoSync();
            renderView();
        }

        // Simpan ke Lokal + Auto Sync Cloud (Debounced 800ms)
        function saveAndAutoSync() {
            localStorage.setItem('catatan_data_db_v2', JSON.stringify(appData));
            setSyncStatus("⏳ Menyimpan...", "saving");

            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                syncDataToCloud();
            }, 800);
        }

        // Ambil Data dari JSONBin Otomatis
        async function loadDataFromLocal() {
            const local = localStorage.getItem('catatan_data_db_v2');
            if (local) {
                appData = JSON.parse(local);
                loadPageSettings();
                renderView();
            }

            if (JSONBIN_BIN_ID) {
                try {
                    setSyncStatus("🔄 Memuat...", "saving");
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        method: 'GET',
                        headers: {
                            'X-Master-Key': JSONBIN_API_KEY
                        }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.record) {
                            appData = data.record;
                            localStorage.setItem('catatan_data_db_v2', JSON.stringify(appData));
                            loadPageSettings();
                            renderView();
                            setSyncStatus("🟢 Terhubung", "saved");
                        }
                    } else {
                        setSyncStatus("🔴 Gagal Memuat", "error");
                    }
                } catch (err) {
                    console.error("Gagal mengambil data dari Cloud:", err);
                    setSyncStatus("🔴 Offline", "error");
                }
            }
        }

        // Mengirimkan Data Terbaru Ke JSONBin Otomatis
        async function syncDataToCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(appData)
                });
                if (res.ok) {
                    setSyncStatus("🟢 Tersimpan", "saved");
                } else {
                    setSyncStatus("🔴 Gagal Sync", "error");
                }
            } catch (err) {
                console.error(err);
                setSyncStatus("🔴 Offline", "error");
            }
        }
    </script>
</body>
</html>
