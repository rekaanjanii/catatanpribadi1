<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKAPAN DATA REKA</title>
    <style>
        :root {
            --bg-base: #120716;
            --accent-color: #ff65a3;
            --accent-secondary: #ff758c;
            --accent-glow: rgba(255, 101, 163, 0.6);
            --card-bg: rgba(25, 12, 32, 0.75);
            --text-muted: #fcd1d7;
            --success: #00f2fe;
            --danger: #ff4e50;
            --warning: #fbc531;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* BACKGROUND ANIMATED GIF & MESH LAYER */
        #bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Background Animasi GIF Bergerak Aesthetic */
            background-image: url('https://i.pinimg.com/originals/34/00/22/340022201d4a8e2d45c6e838e53a23a3.gif');
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) opacity(0.8);
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            opacity: var(--wallpaper-brightness, 0.7);
            transition: opacity 0.3s ease;
        }

        /* CONTAINER 3D GLASS */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 950px;
            min-height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 
                        inset 0 0 25px rgba(255, 105, 180, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 20px;
        }

        /* HEADER */
        .app-header {
            padding: 22px 30px;
            background: rgba(10, 3, 15, 0.5);
            border-bottom: 1px solid rgba(255, 182, 193, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 154, 158, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sync-badge {
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            backdrop-filter: blur(5px);
        }
        .sync-badge.saved { border-color: var(--success); color: var(--success); box-shadow: 0 0 10px rgba(0,242,254,0.4); }
        .sync-badge.saving { border-color: var(--warning); color: var(--warning); }

        /* BODY & PAGES */
        .app-body {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .page-view {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .page-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* DYNAMIC HERO CLOCK */
        .dashboard-hero {
            text-align: center;
            padding: 25px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(138, 43, 226, 0.2));
            border-radius: 22px;
            border: 1px solid rgba(255, 192, 203, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .dashboard-date {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .dashboard-clock {
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #7272f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* MENU GRID 3D */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 182, 193, 0.25);
            padding: 20px 10px;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .menu-btn span.icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .menu-btn:hover {
            background: linear-gradient(135deg, var(--accent-color), #8a2be2);
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 25px var(--accent-glow);
        }

        /* FORMS & TABLES */
        .form-card {
            background: rgba(10, 5, 15, 0.5);
            padding: 22px;
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.2);
            margin-bottom: 22px;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 182, 193, 0.25);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #ff65a3, #ff758c);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .btn-green {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 18px;
        }

        .data-card-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 182, 193, 0.2);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-delete {
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 18px;
        }

        /* PERCENTAGE METRICS STYLES */
        .metric-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 182, 193, 0.2);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        /* MODAL POPUP DIALOG */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: rgba(30, 15, 38, 0.95);
            border: 1px solid rgba(255, 182, 193, 0.3);
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-modal-yes {
            flex: 1;
            padding: 10px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-modal-no {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* OVERLAY LOGIN */
        #login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 3, 15, 0.95);
            backdrop-filter: blur(25px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #login-overlay.hidden { display: none; }
        .login-box {
            width: 90%;
            max-width: 340px;
            text-align: center;
            background: rgba(30, 15, 38, 0.85);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 182, 193, 0.3);
        }
    </style>
</head>
<body>

    <div id="bg-gif"></div>
    <div id="bg-layer"></div>

    <div class="app-container">
        <div id="login-overlay">
            <div class="login-box">
                <div style="font-size: 2.5rem; margin-bottom: 10px;">👑</div>
                <h2 style="margin-bottom: 20px; background: linear-gradient(45deg, #ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN BEAUTIFUL</h2>
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username">
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password">
                </div>
                <button class="btn-primary" onclick="login()">✨ Masuk Dashboard</button>
                <div id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-top: 12px; font-weight: 600;"></div>
            </div>
        </div>

        <div class="app-header">
            <div class="app-title">
                <span>💖</span> REKA ANJANI
            </div>
            <div id="sync-indicator" class="sync-badge saving">⏳ Memuat Cloud...</div>
        </div>

        <div class="app-body">
            
            <div id="page-dashboard" class="page-view active">
                <div class="dashboard-hero">
                    <div id="dashboard-date-text" class="dashboard-date">-</div>
                    <div id="dashboard-clock-text" class="dashboard-clock">00:00:00 WIB</div>
                </div>

                <div class="menu-grid">
                    <button class="menu-btn" onclick="navigateTo('pemasukkan')">
                        <span class="icon">💎</span>
                        <span>Pemasukkan</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('pengeluaran')">
                        <span class="icon">🛍️</span>
                        <span>Pengeluaran</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('simpanan')">
                        <span class="icon">👑</span>
                        <span>Simpanan</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('tabungan')">
                        <span class="icon">🏦</span>
                        <span>Tabungan</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('persentase')">
                        <span class="icon">📊</span>
                        <span>Persentase</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('jadwal')">
                        <span class="icon">🌸</span>
                        <span>Jadwal Job</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('utang')">
                        <span class="icon">🎀</span>
                        <span>Utang / Piutang</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('calendar')">
                        <span class="icon">🗓️</span>
                        <span>Kalender</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('settings')">
                        <span class="icon">✨</span>
                        <span>Pengaturan</span>
                    </button>
                    <button class="menu-btn" onclick="logout()" style="border-color: rgba(255, 78, 80, 0.4);">
                        <span class="icon">🔒</span>
                        <span>Keluar</span>
                    </button>
                </div>
            </div>

            <div id="page-data" class="page-view">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                    <div id="current-page-title" style="font-weight: 700; text-transform: uppercase; color: var(--accent-color);">Tabel Data</div>
                </div>

                <button class="btn-green" onclick="downloadCSVData()">📊 Download Data (.CSV / Excel)</button>

                <div class="form-card">
                    <div class="form-group">
                        <label>📅 Tanggal Data:</label>
                        <input type="date" id="input-date" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>📝 Keterangan / Judul / Job:</label>
                        <input type="text" id="input-desc" class="form-control" placeholder="Contoh: Pembayaran Job / Beli kosmetik">
                    </div>
                    <div class="form-group">
                        <label>💰 Jumlah Nominal (Rp):</label>
                        <input type="number" id="input-amount" class="form-control" placeholder="0">
                    </div>
                    <button class="btn-primary" onclick="addDataItem()">➕ Tambah Data Baru</button>
                </div>

                <div id="data-list-container"></div>

                <div style="margin-top: 18px; padding: 18px; background: rgba(0,0,0,0.5); border-radius: 14px; display: flex; justify-content: space-between; font-weight: bold; border: 1px solid rgba(255,182,193,0.2);">
                    <span>Total Keseluruhan:</span>
                    <span id="total-amount-val" style="color: var(--success);">Rp 0</span>
                </div>
            </div>

            <div id="page-persentase" class="page-view">
                <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                <h3 style="color: var(--accent-color); margin-bottom: 20px;">📊 Tabel Persentase Keuangan</h3>
                
                <div id="persentase-metrics-container"></div>
            </div>

            <div id="page-calendar" class="page-view">
                <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <button class="btn-back" onclick="changeMonth(-1)" style="margin:0;">◀</button>
                    <h3 id="calendar-month-year" style="color: var(--accent-color);">Bulan Tahun</h3>
                    <button class="btn-back" onclick="changeMonth(1)" style="margin:0;">▶</button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 15px;" id="calendar-days-container"></div>
            </div>

            <div id="page-settings" class="page-view">
                <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                <h3 style="color: var(--accent-color); margin-bottom: 15px;">Pengaturan Dashboard</h3>
                <div class="form-card">
                    <div class="form-group">
                        <label>URL Background GIF/Wallpaper Custom:</label>
                        <input type="text" id="wallpaper-url-input" class="form-control" placeholder="https://domain.com/animasi.gif">
                    </div>
                    <button class="btn-primary" onclick="confirmSaveSettings()">💾 Simpan Pengaturan</button>
                </div>
            </div>

        </div>
    </div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 2.5rem; margin-bottom: 10px;">⚠️</div>
            <h3 style="margin-bottom: 8px; color: #fff;">Konfirmasi Hapus</h3>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Apakah Anda yakin ingin menghapus data ini?</p>
            <div class="modal-actions">
                <button class="btn-modal-yes" onclick="executeDelete()">YA, Hapus</button>
                <button class="btn-modal-no" onclick="closeDeleteModal()">TIDAK</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        // JSONBIN CREDENTIALS (SAMA TERUS)
        const JSONBIN_BIN_ID = "6a9a2f36f5f4af5e29681e6f";
        const JSONBIN_API_KEY = "$2a$10$RToIDZQyfCwAmmFIgopn6O1Nf2lOWMZy5cE7zwXLMHjagMg0EP5I.";
        const JSONBIN_ENDPOINT = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        let appData = {
            settings: { themeId: 1, wallpaper: "", brightness: 70 },
            pemasukkan: [],
            pengeluaran: [],
            jadwal: [],
            utang: [],
            simpanan: [],
            tabungan: [] // FITUR TABUNGAN BARU
        };

        let activeCategory = 'pemasukkan';
        let currentCalendarDate = new Date();
        let targetDeleteId = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('is_admin_logged_in') === 'true') {
                document.getElementById('login-overlay').classList.add('hidden');
            }
            document.getElementById('input-date').valueAsDate = new Date();
            startDashboardClock();
            loadLocalBackup();
            loadOnlineData();
        });

        function startDashboardClock() {
            setInterval(() => {
                const now = new Date();
                const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                document.getElementById('dashboard-date-text').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
                document.getElementById('dashboard-clock-text').innerText = `Jam: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} WIB`;
            }, 1000);
        }

        function setSyncStatus(text, statusClass) {
            const el = document.getElementById('sync-indicator');
            if(el) {
                el.innerText = text;
                el.className = `sync-badge ${statusClass}`;
            }
        }

        function saveLocalBackup() {
            localStorage.setItem('catatan_data_app_db_v3', JSON.stringify(appData));
        }

        function loadLocalBackup() {
            const local = localStorage.getItem('catatan_data_app_db_v3');
            if (local) {
                try {
                    appData = JSON.parse(local);
                    if (!appData.tabungan) appData.tabungan = [];
                } catch(e) {}
            }
        }

        async function loadOnlineData() {
            setSyncStatus("⏳ Sinkronisasi Cloud...", "saving");
            try {
                const res = await fetch(`${JSONBIN_ENDPOINT}/latest`, {
                    method: 'GET',
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });

                if (res.ok) {
                    const result = await res.json();
                    if (result.record && typeof result.record === 'object') {
                        appData = result.record;
                        if (!appData.tabungan) appData.tabungan = [];
                        saveLocalBackup();
                        setSyncStatus("🟢 Online Cloud", "saved");
                    }
                } else { setSyncStatus("🟢 Online Cloud", "saved"); }
            } catch (e) { setSyncStatus("🟢 Online Cloud", "saved"); }
        }

        async function saveOnlineData() {
            saveLocalBackup();
            setSyncStatus("⏳ Menyimpan...", "saving");
            try {
                const res = await fetch(JSONBIN_ENDPOINT, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(appData)
                });
                if (res.ok) setSyncStatus("🟢 Tersimpan Online", "saved");
            } catch (e) { setSyncStatus("🟡 Tersimpan Lokal", "saved"); }
        }

        function login() {
            if (document.getElementById('username').value === ADMIN_USER && document.getElementById('password').value === ADMIN_PASS) {
                localStorage.setItem('is_admin_logged_in', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
                loadOnlineData();
            } else {
                document.getElementById('login-error').innerText = "Username/Password Salah!";
            }
        }

        function logout() {
            localStorage.removeItem('is_admin_logged_in');
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function navigateTo(targetPage) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));

            if (targetPage === 'dashboard') {
                document.getElementById('page-dashboard').classList.add('active');
            } else if (targetPage === 'persentase') {
                document.getElementById('page-persentase').classList.add('active');
                renderPersentaseView();
            } else if (targetPage === 'calendar') {
                document.getElementById('page-calendar').classList.add('active');
                renderCalendarView();
            } else if (targetPage === 'settings') {
                document.getElementById('page-settings').classList.add('active');
            } else {
                activeCategory = targetPage;
                document.getElementById('page-data').classList.add('active');
                document.getElementById('current-page-title').innerText = "Tabel " + targetPage.toUpperCase();
                renderCategoryView();
            }
        }

        function addDataItem() {
            const date = document.getElementById('input-date').value;
            const desc = document.getElementById('input-desc').value.trim();
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;

            if (!date || !desc) {
                alert("Harap isi tanggal dan keterangan!");
                return;
            }

            if (!appData[activeCategory]) appData[activeCategory] = [];

            appData[activeCategory].push({ id: Date.now(), date, desc, amount });
            document.getElementById('input-desc').value = '';
            document.getElementById('input-amount').value = '';

            renderCategoryView();
            saveOnlineData();
        }

        /* POPUP CONFIRMATION DELETE */
        function openDeleteModal(id) {
            targetDeleteId = id;
            document.getElementById('delete-modal').classList.add('active');
        }

        function closeDeleteModal() {
            targetDeleteId = null;
            document.getElementById('delete-modal').classList.remove('active');
        }

        function executeDelete() {
            if (targetDeleteId !== null) {
                appData[activeCategory] = appData[activeCategory].filter(x => x.id !== targetDeleteId);
                renderCategoryView();
                saveOnlineData();
                closeDeleteModal();
            }
        }

        function renderCategoryView() {
            const container = document.getElementById('data-list-container');
            container.innerHTML = '';
            let total = 0;

            const items = appData[activeCategory] || [];

            if (items.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted);">Belum ada data di tabel ini.</div>`;
            } else {
                items.forEach(item => {
                    total += item.amount;
                    const card = document.createElement('div');
                    card.className = 'data-card-item';
                    card.innerHTML = `
                        <div>
                            <div style="font-weight:600; font-size:1rem;">${item.desc}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted);">📅 ${item.date}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="font-weight:700; color:var(--success);">Rp ${item.amount.toLocaleString('id-ID')}</div>
                            <button class="btn-delete" onclick="openDeleteModal(${item.id})">Hapus</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            document.getElementById('total-amount-val').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        /* METODE PERSENTASE KEUANGAN */
        function renderPersentaseView() {
            const container = document.getElementById('persentase-metrics-container');
            container.innerHTML = '';

            const sum = arr => (arr || []).reduce((acc, curr) => acc + (curr.amount || 0), 0);

            const totPemasukkan = sum(appData.pemasukkan);
            const totPengeluaran = sum(appData.pengeluaran);
            const totSimpanan = sum(appData.simpanan);
            const totTabungan = sum(appData.tabungan);

            const grandTotal = totPemasukkan || 1; // Mencegah Divide by Zero

            const pctPengeluaran = ((totPengeluaran / grandTotal) * 100).toFixed(1);
            const pctSimpanan = ((totSimpanan / grandTotal) * 100).toFixed(1);
            const pctTabungan = ((totTabungan / grandTotal) * 100).toFixed(1);

            const metrics = [
                { title: '💎 Total Pemasukkan (Acuan 100%)', val: totPemasukkan, pct: 100, color: '#00f2fe' },
                { title: '🛍️ Rasio Pengeluaran', val: totPengeluaran, pct: pctPengeluaran, color: '#ff4e50' },
                { title: '👑 Rasio Simpanan', val: totSimpanan, pct: pctSimpanan, color: '#ffd700' },
                { title: '🏦 Rasio Tabungan', val: totTabungan, pct: pctTabungan, color: '#38ef7d' }
            ];

            metrics.forEach(m => {
                const card = document.createElement('div');
                card.className = 'metric-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-weight:600;">
                        <span>${m.title}</span>
                        <span style="color:${m.color}">${m.pct}% (Rp ${m.val.toLocaleString('id-ID')})</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${Math.min(m.pct, 100)}%; background: ${m.color};"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderCalendarView() {
            const container = document.getElementById('calendar-days-container');
            const label = document.getElementById('calendar-month-year');
            container.innerHTML = '';

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            label.innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) container.appendChild(document.createElement('div'));

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.style.background = 'rgba(0,0,0,0.3)';
                cell.style.padding = '8px';
                cell.style.borderRadius = '8px';
                cell.style.minHeight = '45px';
                cell.innerText = day;
                container.appendChild(cell);
            }
        }

        function changeMonth(step) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + step);
            renderCalendarView();
        }

        function downloadCSVData() {
            const items = appData[activeCategory] || [];
            let csv = "Tanggal,Keterangan,Nominal\n";
            items.forEach(r => csv += `"${r.date}","${r.desc}","${r.amount}"\n`);
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = `Data_${activeCategory.toUpperCase()}.csv`;
            link.click();
        }

        function confirmSaveSettings() {
            alert("✅ Pengaturan Berhasil Disimpan!");
        }
    </script>
</body>
</html>
