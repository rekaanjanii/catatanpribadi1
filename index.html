<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKAPAN REKA</title>
    <style>
        :root {
            --bg-base: #1a0b1e;
            --accent-color: #ff65a3;
            --accent-secondary: #ff758c;
            --accent-glow: rgba(255, 101, 163, 0.5);
            --card-bg: rgba(30, 15, 38, 0.75);
            --text-muted: #fcd1d7;
            --success: #00f2fe;
            --danger: #ff4e50;
            --warning: #fbc531;
            --gold-accent: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* 3D ANIMATED BACKGROUND & PARTICLE MESH */
        #bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255, 117, 140, 0.25), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(120, 115, 245, 0.25), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(255, 101, 163, 0.15), transparent 60%);
            animation: meshMove 12s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(4deg); }
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            opacity: var(--wallpaper-brightness, 0.7);
            transition: opacity 0.3s ease;
        }

        /* CONTAINER 3D GLASS */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 920px;
            min-height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255, 182, 193, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        inset 0 0 20px rgba(255, 105, 180, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 20px;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* HEADER BEAUTIFUL */
        .app-header {
            padding: 22px 30px;
            background: rgba(15, 5, 20, 0.35);
            border-bottom: 1px solid rgba(255, 182, 193, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 154, 158, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sync-badge {
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .sync-badge.saved { border-color: var(--success); color: var(--success); box-shadow: 0 0 8px rgba(0,242,254,0.3); }
        .sync-badge.saving { border-color: var(--warning); color: var(--warning); }
        .sync-badge.error { border-color: var(--danger); color: var(--danger); }

        /* BODY & PAGES */
        .app-body {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .page-view {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .page-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 3D HERO DYNAMIC CLOCK */
        .dashboard-hero {
            text-align: center;
            padding: 25px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.15), rgba(138, 43, 226, 0.15));
            border-radius: 22px;
            border: 1px solid rgba(255, 192, 203, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .dashboard-hero:hover {
            transform: translateZ(10px) rotateX(2deg) rotateY(-2deg);
        }

        .dashboard-date {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .dashboard-clock {
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #7272f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* MENU GRID 3D CARDS */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 182, 193, 0.2);
            padding: 22px 12px;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        .menu-btn span.icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 8px var(--accent-glow));
            transition: transform 0.3s ease;
        }
        .menu-btn:hover {
            background: linear-gradient(135deg, var(--accent-color), #8a2be2);
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 25px var(--accent-glow);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .menu-btn:hover span.icon {
            transform: scale(1.2) rotate(8deg);
        }

        /* FORM INPUTS & LISTS */
        .form-card {
            background: rgba(10, 5, 15, 0.4);
            padding: 22px;
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.15);
            margin-bottom: 22px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: border 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #ff65a3, #ff758c);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn-green {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 18px;
            box-shadow: 0 6px 15px rgba(56, 239, 125, 0.3);
        }

        .data-card-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 182, 193, 0.15);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            transition: transform 0.2s ease;
        }
        .data-card-item:hover {
            transform: translateX(4px);
            background: rgba(255, 255, 255, 0.07);
        }
        .data-info .data-primary { font-weight: 600; font-size: 1rem; color: #fff; }
        .data-info .data-secondary { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .data-amount { font-weight: 700; color: var(--success); font-size: 1.05rem; }

        .btn-delete {
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 18px;
            transition: background 0.2s;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.2); }

        /* CALENDAR BEAUTIFUL */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .calendar-day-cell {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 182, 193, 0.1);
            min-height: 55px;
            padding: 6px;
            border-radius: 10px;
            font-size: 0.85rem;
        }
        .calendar-day-cell.has-job {
            border-color: var(--accent-color);
            background: rgba(255, 101, 163, 0.2);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* THEME GRID */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .theme-option-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .theme-option-card.selected {
            border-color: var(--accent-color);
            background: rgba(255, 101, 163, 0.2);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .theme-color-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; }

        /* OVERLAY LOGIN BEAUTIFUL */
        #login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 20, 0.95);
            backdrop-filter: blur(25px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        #login-overlay.hidden { display: none; }
        .login-box {
            width: 100%;
            max-width: 340px;
            text-align: center;
            background: rgba(30, 15, 38, 0.8);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- 3D DYNAMIC MESH BACKGROUND -->
    <div id="bg-mesh"></div>
    <div id="bg-layer"></div>

    <div class="app-container">
        <!-- LOGIN OVERLAY -->
        <div id="login-overlay">
            <div class="login-box">
                <div style="font-size: 2.5rem; margin-bottom: 10px;">👑</div>
                <h2 style="margin-bottom: 20px; background: linear-gradient(45deg, #ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN BEAUTIFUL</h2>
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username">
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password">
                </div>
                <button class="btn-primary" onclick="login()">✨ Masuk Dashboard</button>
                <div id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-top: 12px; font-weight: 600;"></div>
            </div>
        </div>

        <!-- HEADER -->
        <div class="app-header">
            <div class="app-title">
                <span>💖</span> REKA ANJANI
            </div>
            <div id="sync-indicator" class="sync-badge saving">⏳ Memuat Cloud...</div>
        </div>

        <!-- BODY PAGES -->
        <div class="app-body">
            
            <!-- PAGE: DASHBOARD -->
            <div id="page-dashboard" class="page-view active">
                <div class="dashboard-hero">
                    <div id="dashboard-date-text" class="dashboard-date">-</div>
                    <div id="dashboard-clock-text" class="dashboard-clock">00:00:00 WIB</div>
                </div>

                <div class="menu-grid">
                    <button class="menu-btn" onclick="navigateTo('pemasukkan')">
                        <span class="icon">💎</span>
                        <span>Pemasukkan</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('pengeluaran')">
                        <span class="icon">🛍️</span>
                        <span>Pengeluaran</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('jadwal')">
                        <span class="icon">🌸</span>
                        <span>Jadwal</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('utang')">
                        <span class="icon">🎀</span>
                        <span>Utang / Piutang</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('simpanan')">
                        <span class="icon">👑</span>
                        <span>Simpanan</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('calendar')">
                        <span class="icon">🗓️</span>
                        <span>Kalender</span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('settings')">
                        <span class="icon">✨</span>
                        <span>Pengaturan</span>
                    </button>
                    <button class="menu-btn" onclick="logout()" style="border-color: rgba(255, 78, 80, 0.4);">
                        <span class="icon">🔒</span>
                        <span>Keluar</span>
                    </button>
                </div>
            </div>

            <!-- PAGE: DATA VIEWER -->
            <div id="page-data" class="page-view">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                    <div id="current-page-title" style="font-weight: 700; text-transform: uppercase; color: var(--accent-color);">Tabel Data</div>
                </div>

                <button class="btn-green" onclick="downloadCSVData()">📊 Download Data (.CSV / Excel)</button>

                <div class="form-card">
                    <div class="form-group">
                        <label>📅 Tanggal Data:</label>
                        <input type="date" id="input-date" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>📝 Keterangan / Job:</label>
                        <input type="text" id="input-desc" class="form-control" placeholder="Contoh: Pembayaran Job / Beli kosmetik">
                    </div>
                    <div class="form-group">
                        <label>💰 Jumlah Nominal (Rp):</label>
                        <input type="number" id="input-amount" class="form-control" placeholder="0">
                    </div>
                    <button class="btn-primary" onclick="addDataItem()">➕ Simpan Data Baru</button>
                </div>

                <div id="data-list-container"></div>

                <div style="margin-top: 18px; padding: 18px; background: rgba(0,0,0,0.4); border-radius: 14px; display: flex; justify-content: space-between; font-weight: bold; border: 1px solid rgba(255,182,193,0.2);">
                    <span>Total Keseluruhan:</span>
                    <span id="total-amount-val" style="color: var(--success);">Rp 0</span>
                </div>
            </div>

            <!-- PAGE: CALENDAR -->
            <div id="page-calendar" class="page-view">
                <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <button class="btn-back" onclick="changeMonth(-1)" style="margin:0;">◀</button>
                    <h3 id="calendar-month-year" style="color: var(--accent-color);">Bulan Tahun</h3>
                    <button class="btn-back" onclick="changeMonth(1)" style="margin:0;">▶</button>
                </div>
                <div class="calendar-grid" id="calendar-days-container"></div>
            </div>

            <!-- PAGE: SETTINGS -->
            <div id="page-settings" class="page-view">
                <button class="btn-back" onclick="navigateTo('dashboard')">← Kembali</button>
                <h3 style="color: var(--accent-color); margin-bottom: 15px;">Pengaturan Dashboard</h3>
                
                <div class="form-card">
                    <label>Pilih Varian Tema Beautiful (50 Varian Feminim):</label>
                    <div class="theme-grid" id="theme-grid"></div>
                </div>

                <div class="form-card">
                    <div class="form-group">
                        <label>URL Image Background Wallpaper:</label>
                        <input type="text" id="wallpaper-url-input" class="form-control" placeholder="https://domain.com/gambar.jpg">
                    </div>
                    <div class="form-group">
                        <label>Atau Upload Wallpaper (Lokal):</label>
                        <input type="file" id="wallpaper-file-input" class="form-control" accept="image/*" onchange="handleWallpaperUpload(event)">
                    </div>
                    <div class="form-group">
                        <label>Kecerahan Gambar Wallpaper (%):</label>
                        <input type="range" id="val-brightness" min="10" max="100" value="70" style="width: 100%;">
                    </div>
                    <button class="btn-primary" onclick="confirmSaveSettings()">💾 Simpan Pengaturan</button>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT CLOUD HYBRID ENGINE V3 -->
    <script>
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        // JSONBin Cloud Credentials
        const JSONBIN_BIN_ID = "6a9a2f36f5f4af5e29681e6f";
        const JSONBIN_API_KEY = "$2a$10$RToIDZQyfCwAmmFIgopn6O1Nf2lOWMZy5cE7zwXLMHjagMg0EP5I.";
        const JSONBIN_ENDPOINT = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        const FEMININE_THEMES = Array.from({ length: 50 }, (_, i) => {
            const hue = (i * 7.2) % 360;
            return {
                id: i + 1,
                name: `Tema Varian ${i + 1}`,
                bg: `hsl(${hue}, 40%, 10%)`,
                accent: `hsl(${hue}, 90%, 68%)`,
                card: `hsla(${hue}, 35%, 15%, 0.78)`,
                textMuted: `hsl(${hue}, 80%, 88%)`
            };
        });

        let tempSelectedThemeId = 1;
        let tempUploadedWallpaper = "";

        let appData = {
            settings: { themeId: 1, wallpaper: "", brightness: 70 },
            pemasukkan: [],
            pengeluaran: [],
            jadwal: [],
            utang: [],
            simpanan: []
        };

        let activeCategory = 'pemasukkan';
        let currentCalendarDate = new Date();

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('is_admin_logged_in') === 'true') {
                document.getElementById('login-overlay').classList.add('hidden');
            }
            document.getElementById('input-date').valueAsDate = new Date();
            startDashboardClock();
            
            loadLocalBackup();
            loadOnlineData();
        });

        function startDashboardClock() {
            function updateClock() {
                const now = new Date();
                const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                
                document.getElementById('dashboard-date-text').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
                document.getElementById('dashboard-clock-text').innerText = `Jam: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} WIB`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function setSyncStatus(text, statusClass) {
            const el = document.getElementById('sync-indicator');
            if(el) {
                el.innerText = text;
                el.className = `sync-badge ${statusClass}`;
            }
        }

        function saveLocalBackup() {
            localStorage.setItem('catatan_data_app_db_v2', JSON.stringify(appData));
        }

        function loadLocalBackup() {
            const local = localStorage.getItem('catatan_data_app_db_v2');
            if (local) {
                try {
                    appData = JSON.parse(local);
                    tempSelectedThemeId = appData.settings.themeId || 1;
                    applyThemeStyle();
                    if (document.getElementById('page-data').classList.contains('active')) {
                        renderCategoryView();
                    }
                } catch(e) {
                    console.error("Format data lokal tidak valid", e);
                }
            }
        }

        async function loadOnlineData() {
            setSyncStatus("⏳ Sinkronisasi Cloud...", "saving");
            try {
                const res = await fetch(`${JSONBIN_ENDPOINT}/latest`, {
                    method: 'GET',
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });

                if (res.ok) {
                    const result = await res.json();
                    if (result.record && typeof result.record === 'object') {
                        appData = result.record;
                        saveLocalBackup();
                        tempSelectedThemeId = appData.settings.themeId || 1;
                        applyThemeStyle();
                        if (document.getElementById('page-data').classList.contains('active')) {
                            renderCategoryView();
                        }
                        setSyncStatus("🟢 Online Cloud", "saved");
                    }
                } else {
                    setSyncStatus("🟡 Mode Lokal (Aman)", "saved");
                }
            } catch (e) {
                setSyncStatus("🟡 Mode Lokal (Aman)", "saved");
            }
        }

        async function saveOnlineData() {
            saveLocalBackup();
            setSyncStatus("⏳ Menyimpan...", "saving");
            try {
                const res = await fetch(JSONBIN_ENDPOINT, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(appData)
                });

                if (res.ok) {
                    setSyncStatus("🟢 Tersimpan Online", "saved");
                } else {
                    setSyncStatus("🟡 Tersimpan di HP/Lokal", "saved");
                }
            } catch (e) {
                setSyncStatus("🟡 Tersimpan di HP/Lokal", "saved");
            }
        }

        function login() {
            if (document.getElementById('username').value === ADMIN_USER && document.getElementById('password').value === ADMIN_PASS) {
                localStorage.setItem('is_admin_logged_in', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
                loadOnlineData();
            } else {
                document.getElementById('login-error').innerText = "Username/Password Salah!";
            }
        }

        function logout() {
            localStorage.removeItem('is_admin_logged_in');
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function navigateTo(targetPage) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));

            if (targetPage === 'dashboard') {
                document.getElementById('page-dashboard').classList.add('active');
            } else if (targetPage === 'settings') {
                document.getElementById('page-settings').classList.add('active');
                tempSelectedThemeId = appData.settings.themeId || 1;
                renderThemeGrid();
                loadSettingsUI();
            } else if (targetPage === 'calendar') {
                document.getElementById('page-calendar').classList.add('active');
                renderCalendarView();
            } else {
                activeCategory = targetPage;
                document.getElementById('page-data').classList.add('active');
                document.getElementById('current-page-title').innerText = "Tabel " + targetPage.toUpperCase();
                renderCategoryView();
            }
        }

        function renderThemeGrid() {
            const grid = document.getElementById('theme-grid');
            grid.innerHTML = '';
            FEMININE_THEMES.forEach(t => {
                const card = document.createElement('div');
                card.className = `theme-option-card ${t.id === tempSelectedThemeId ? 'selected' : ''}`;
                card.onclick = () => {
                    tempSelectedThemeId = t.id;
                    renderThemeGrid();
                };
                card.innerHTML = `
                    <div class="theme-color-dots">
                        <div class="color-dot" style="background:${t.accent};"></div>
                        <div class="color-dot" style="background:${t.card}; border:1px solid #fff;"></div>
                    </div>
                    <div>#${t.id} ${t.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function handleWallpaperUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 350;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    tempUploadedWallpaper = canvas.toDataURL('image/jpeg', 0.3);
                    alert("Wallpaper dipilih! Klik 'Simpan Pengaturan' untuk menerapkan.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function loadSettingsUI() {
            document.getElementById('wallpaper-url-input').value = appData.settings.wallpaper.startsWith('data:') ? '' : (appData.settings.wallpaper || '');
            document.getElementById('val-brightness').value = appData.settings.brightness || 70;
            tempUploadedWallpaper = "";
        }

        function confirmSaveSettings() {
            appData.settings.themeId = tempSelectedThemeId;
            const urlInput = document.getElementById('wallpaper-url-input').value.trim();

            if (tempUploadedWallpaper !== "") {
                appData.settings.wallpaper = tempUploadedWallpaper;
            } else if (urlInput !== "") {
                appData.settings.wallpaper = urlInput;
            }

            appData.settings.brightness = document.getElementById('val-brightness').value;

            applyThemeStyle();
            saveOnlineData();
            alert("✅ Pengaturan Berhasil Disimpan!");
        }

        function applyThemeStyle() {
            const t = FEMININE_THEMES.find(x => x.id === (appData.settings.themeId || 1)) || FEMININE_THEMES[0];
            document.documentElement.style.setProperty('--bg-base', t.bg);
            document.documentElement.style.setProperty('--accent-color', t.accent);
            document.documentElement.style.setProperty('--accent-glow', `${t.accent}77`);
            document.documentElement.style.setProperty('--card-bg', t.card);
            document.documentElement.style.setProperty('--text-muted', t.textMuted);

            const bgLayer = document.getElementById('bg-layer');
            if (appData.settings.wallpaper) {
                bgLayer.style.backgroundImage = `url('${appData.settings.wallpaper}')`;
                bgLayer.style.setProperty('--wallpaper-brightness', (appData.settings.brightness || 70) / 100);
            } else {
                bgLayer.style.backgroundImage = "none";
            }
        }

        function addDataItem() {
            const date = document.getElementById('input-date').value;
            const desc = document.getElementById('input-desc').value.trim();
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;

            if (!date || !desc) {
                alert("Harap isi tanggal dan keterangan!");
                return;
            }

            if (!appData[activeCategory]) {
                appData[activeCategory] = [];
            }

            const newItem = { id: Date.now(), date, desc, amount };
            appData[activeCategory].push(newItem);

            document.getElementById('input-desc').value = '';
            document.getElementById('input-amount').value = '';

            renderCategoryView();
            saveOnlineData();
        }

        function deleteDataItem(id) {
            appData[activeCategory] = appData[activeCategory].filter(x => x.id !== id);
            renderCategoryView();
            saveOnlineData();
        }

        function renderCategoryView() {
            const container = document.getElementById('data-list-container');
            container.innerHTML = '';
            let total = 0;

            const items = appData[activeCategory] || [];

            if (items.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 0.95rem;">Belum ada data untuk kategori ini.</div>`;
            } else {
                items.forEach(item => {
                    total += item.amount;
                    const card = document.createElement('div');
                    card.className = 'data-card-item';
                    card.innerHTML = `
                        <div class="data-info">
                            <div class="data-primary">${item.desc}</div>
                            <div class="data-secondary">📅 ${item.date}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="data-amount">Rp ${item.amount.toLocaleString('id-ID')}</div>
                            <button class="btn-delete" onclick="deleteDataItem(${item.id})">Hapus</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            document.getElementById('total-amount-val').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function downloadCSVData() {
            const items = appData[activeCategory] || [];
            if (items.length === 0) {
                alert("Tidak ada data untuk di-download!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Tanggal,Keterangan,Nominal\n";
            items.forEach(row => {
                csvContent += `"${row.date}","${row.desc}","${row.amount}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Data_${activeCategory.toUpperCase()}_BEAUTIFUL.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderCalendarView() {
            const container = document.getElementById('calendar-days-container');
            const label = document.getElementById('calendar-month-year');
            container.innerHTML = '';

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            label.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const jobDates = new Set();
            [...(appData.jadwal || []), ...(appData.pemasukkan || [])].forEach(item => {
                if (item.date) jobDates.add(item.date);
            });

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day-cell';
                emptyCell.style.border = 'none';
                container.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                cell.innerText = day;

                if (jobDates.has(dayString)) {
                    cell.classList.add('has-job');
                    cell.innerHTML += `<span style="font-size:0.65rem; color:var(--accent-color); display:block; margin-top:2px;">✨ Job</span>`;
                }
                container.appendChild(cell);
            }
        }

        function changeMonth(step) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + step);
            renderCalendarView();
        }
    </script>
</body>
</html>
